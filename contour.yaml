                {"created": 0, "fetched": 0, "impl": 0, "seen": 1, "unknown": 1}
              ref: 'phase 15: 26077729 - 299 = 26077430 is the first block of the window'
            - given: 'a db made by block_store(), closed'
              when: 'respond(db, "/api/clusters?level=L0", cache={}), respond(db, "/api/clusters?level=L1&n=1", cache={}) and respond(db, "/api/clusters?level=impl", cache={})'
              then: >
                200 each; {"level": "L0", "n": 20, "clusters": the 7 L0 rows of
                build_clusters(block_store()) in order, the first with key
                "8b5db55fa9ab3b9527508d4abe0b39eb588bf310270c8e04b3f38214e8ba63b4"
                and 4 members}; {"level": "L1", "n": 1, "clusters": one row,
                key "29ec9639b8fa8f759c993d77fe43ccfb471dd596d23b3b098965ebb64e56235f",
                8 members}; {"level": "impl", "n": 20, "clusters": []}
              ref: 'measured with build_clusters over block_store() 2026-10-02: 7 L0, 2 L1, 2 proxy, 4 eip7702, 0 impl'
            - given: 'a db made by block_store(), closed, and one dict c used as the cache; time.monotonic patched to return T, then T + 30, then T + 61'
              when: >
                respond(db, "/api/clusters?level=L0", cache=c) at T; then a
