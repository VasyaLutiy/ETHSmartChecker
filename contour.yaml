              then: '7 L0 rows at T and at T + 30 (the cached list); 8 at T + 61 and with a fresh cache, one of them with key "8571d00b598627ac40e1ae7bc4d0cb3fd5a77a0d663763fdfc1cd9127b63cb4d" and the two members'
              ref: 'phase 15: the 60-s cache; code_id of code_belle.hex measured 2026-10-02'
            - given: 'the phase-13 database of Open Read Only example 2, its sha256 and directory listing taken'
              when: 'respond on "/api/health", "/api/events", "/api/summary" and "/api/clusters?level=impl" (cache={})'
              then: >
