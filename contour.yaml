            - given: 'FakeRpc() without storage (eth_getStorageAt raises KeyError) over the fixtures, progress 26077728, the Infura prices with eth_getStorageAt 80, daily_budget 3000000, day "2026-10-01"'
              when: 'follow_chain is called'
