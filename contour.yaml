              ref: 'phase 14 migration; 20 counted with is_std_proxy over codes_26077729.json; on the live 01.10 copy: 210952 rows, 5092 of them standard proxies'
            - given: 'a fresh temp db path'
              when: 'Store(path) is opened and closed, then the file is opened with a plain sqlite3.connect and PRAGMA journal_mode is read; then Store(path) is opened and closed again and the pragma is read again'
              then: >
