        - name: Follow Chain
          description: >
            follow_chain(rpc, store, start=None, stop=None,
            max_calls_per_block=None, daily_budget=None, day=None,
            prices=None, on_alerts=None, workers=None, code_tag=None,
            on_upgrades=None)
            -> summary {blocks, stopped,
            progress, alerts, day, upgrades}. day is a "%Y-%m-%d" string pinning every
            block of the pass, or a callable of no arguments returning one;
            day=None means today's UTC date, resolved afresh before each
            block. prices=None means {}. on_alerts is the per-block alert
            sink passed down to ingest_block. Polls
            eth_blockNumber, then for each block after progress (or from
            start) up to the head (or stop): eth_getBlockReceipts,
            ingest_block with get_code over eth_getCode.
          behavior: >
            Before every RPC call it checks spent(day) + price <= daily_budget
            and, if not, stops cleanly with stopped "budget" and progress at the
            last complete block. stopped is None when the range was walked to
            its end, "budget" when the daily budget cut it, "cap" when
            max_calls_per_block left a block incomplete. alerts is the
            concatenation of the alerts of every ingest_block call, in block
            order, the incomplete block included: an alert found before a
            budget or cap stop is never dropped with the block that carried
            it. on_alerts is handed to every ingest_block call, so a caller
            learns a block's alerts as that block ends, not when the pass
            does; a pass cut short by KeyboardInterrupt has already delivered
            the alerts of every block it walked, the interrupted one
            included, and the exception then propagates.
            Follow Chain is the only writer of the credit ledger:
            after each successful rpc call it does store.spend(day, method,
            prices.get(method, 0)); RpcClient.on_spend is left unconnected.
            set_progress runs only for a complete block; a rerun resumes the
            unfinished block, skipping known addresses. The ledger day is
            resolved once before the eth_blockNumber charge and again before
            each block, so a pass that runs across midnight UTC charges each
            block to the day it was actually walked on; an explicit day
            string pins every block of the pass, as the examples below do.
            summary day is the last day resolved, the one a caller reports
            spent() for.
            Phase 10. workers is handed to every ingest_block call unchanged.
            code_tag is the block tag of eth_getCode: None keeps hex(block),
            the block being ingested (the Infura behaviour, TASK_PHASE4 §2);
            "latest" asks for the current code, because the public node
            refuses eth_getCode on a block more than about 128 behind the
            head (HTTP 403, -32602 "Archive requests require a personal
            token", measured 2026-09-30). The price, the budget cap and the
            charge per eth_getCode are the same under workers as without
            them, but the store -- the ledger included -- is written only
            from the calling thread: with workers > 1 a get_code handed to
            ingest_block does the rpc call and nothing else, and the charges of a block's
            successful eth_getCode calls reach store.spend in the calling
            thread before that block's set_progress, and also when the block
            stops on a cap, a budget or a KeyboardInterrupt. A receipts
            answer that is not a list (null included) is not an empty block:
            follow_chain raises RpcError(None, "eth_getBlockReceipts returned
            null") before any charge for that call, before ingest_block and
            before set_progress, so progress stays at the last complete
            block and a rerun asks for the same block again.
            Phase 14. Every ingest_block call gets get_storage(address, slot,
            blk) = rpc.call("eth_getStorageAt", [address, slot, tag]) with
            the tag rule of eth_getCode (hex(blk), or code_tag verbatim),
            and on_upgrades unchanged; summary["upgrades"] is the
            concatenation of the blocks' upgrades in block order, the
            incomplete block included. Budget: before each eth_getStorageAt
            the check is spent(day) + price(eth_getStorageAt) +
            price(eth_getCode) <= daily_budget -- one read and the code
            fetch it may trigger -- and when it fails get_storage returns
            None without a call (the implementation stays empty, the block
            is not stopped: slot reads never set stopped and never cap the
            block). Each successful eth_getStorageAt is charged
            price(eth_getStorageAt) (prices.get, 0 when absent); the
            implementation's eth_getCode goes through the block's get_code
            and is charged like a candidate's. Under workers > 1 the reads
            are charged from the calling thread like the candidate calls,
            and the budget check runs in the calling thread before a read
            is submitted, against the ledger as it stands then. The slot
            reads are outside max_calls_per_block. Measured on the live
            01.10 copy over 5 blocks after its progress: 29 known-proxy
            touches per block on average (6..38), under the 50 at which the
            re-read would have become a flag, so there is no flag.
            Phase 15 (events). follow_chain records the live stream in the
            store: every ingest_block call gets sinks of follow_chain's own
            that keep, in the order received, what ingest_block delivers
            and forward it unchanged to on_alerts / on_upgrades when those
            are given (None still means nobody is told). After each
            ingest_block call -- on its normal return, the incomplete
            block of a cap or budget stop included, and on the
            KeyboardInterrupt path too (try/finally, the interrupt then
            propagates) -- when the block delivered anything, follow_chain
            calls store.add_events once, in the calling thread, with the
            block's ALERTs first and then its UPGRADEs, each in the order
            delivered: an ALERT is the alert dict plus kind "ALERT"; an
            UPGRADE is {kind "UPGRADE", address, old_impl = old, new_impl =
            new}; every event of the block carries block = that block's
            number and the same at, the UTC time of the write as
            "%Y-%m-%dT%H:%M:%SZ". The events of a complete block are written
            before its set_progress. So every ALERT and UPGRADE line the CLI
            prints has exactly one event, and an event exists only for a
            line handed to the sinks -- --alert-on filters stdout only, the
            events hold the unfiltered list. The summary, its keys, the
            stats, the ledger and the printed lines are unchanged.
            recheck and seed add never write events: they do not go
            through follow_chain.
          guardrails: [Budget Respected, No Network In Core]
          steps:
            - calls: Ingest Block
            - uses: rpc
            - uses: store
          examples:
            - given: >
