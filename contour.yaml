              ref: 'phase 15 migration; on the 01.10 night2 copy: 214132 addresses, progress 26099873'
        - name: Track Progress
          description: >
            get_progress() -> int or None, the last fully ingested block;
            set_progress(block) stores it. Phase 15: set_progress also
            writes updated_at, the UTC time of the call as text
            "YYYY-MM-DDTHH:MM:SSZ" (to the second, datetime.now with
            timezone.utc, format "%Y-%m-%dT%H:%M:%SZ"); progress_at() ->
            str or None reads it back -- None on a fresh db, and None for a
            progress row written before phase 15 until the next
            set_progress. This is the listener's heartbeat: the dashboard
            tells a live listener from a dead one by it.
          steps:
            - modifies: Code Database
          examples:
            - given: 'a fresh temp db'
              when: 'get_progress is called, then set_progress(26077729) and get_progress, then the db is reopened'
              then: 'None, then 26077729, and 26077729 after the reopen'
            - given: 'a fresh temp db; t0 = the UTC time truncated to the second just before the call, t1 = the UTC time just after'
              when: 'progress_at() is called, then set_progress(26077729), then progress_at() again, then the db is reopened and progress_at() is read'
              then: >
                None first; then a str of 20 characters matching
                ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
                whose parsed time t satisfies t0 <= t <= t1; the same str
                after the reopen; get_progress() is 26077729
              ref: 'phase 15 heartbeat'
        - name: Manage Watchlist
          description: >
            add_seed(address, label) marks the stored code of address as a
            known-bad seed; seeds() -> list of {address, label, code_id}
            sorted by address. Phase 12: remove_seed(address) -> bool
            deletes the seed of address and returns True, or returns False
            when the address is not a seed. Phase 14: a seed on a standard
            proxy with a stored implementation whose code is stored seeds
            through that implementation -- the seed row carries the
            implementation's code_id.
          behavior: >
            add_seed on an address with no stored code raises
            KeyError(address): both an address the db does not know and a
            known address stored with code_id None (an EOA). The address may
            come in any case. Adding the same address twice keeps one seed
            with the latest label. remove_seed takes the address in any case,
            deletes only the one row of the seeds table and commits; the
            codes and addresses rows of that address stay as they were, so
            the address can be seeded again with add_seed and no rpc call. It
            never raises for an unknown address or for an address that is
            stored but not a seed: both give False and change nothing.
            Seeding through the implementation (phase 14): add_seed(address,
            label) stores as the seed's code_id the code_id of the
            implementation address when implementations() has address with
            a code_id that is not None (a standard proxy whose implementation
            is stored with code); otherwise the address's own code_id as
            before (a non-proxy, a proxy with NULL implementation, or one
            whose implementation address is unknown or stored without code
            -- phase 9 stands for those: such a seed matches nothing). The
            seed row's address stays the proxy's address, so seeds() lists
            the address the operator gave with the implementation's
            code_id. add_seed reads the implementation at the time of the
            call; a later set_implementation does not move the seed.
          steps:
            - modifies: Code Database
          examples:
            - given: >
                a db holding code_belle.hex at 0x34c6211621f2763c60eb007dc2ae91090a2d22f6
                (Etherscan: "This token is reported to be a honeypot token")
              when: 'add_seed(address, "BELLE honeypot") is called twice'
              then: 'seeds() has exactly 1 entry, label "BELLE honeypot", code_id = fingerprint(code_belle).code_id'
              ref: 'Etherscan warning on the address, checked 2026-09-28'
            - given: 'an address that is not in the db'
              when: 'add_seed is called'
              then: 'KeyError'
            - given: 'a db holding code_belle.hex at 0x34c6211621f2763c60eb007dc2ae91090a2d22f6, seeded "BELLE honeypot"'
              when: 'remove_seed("0x34C6211621F2763C60EB007DC2AE91090A2D22F6") is called twice, then add_seed(address, "BELLE again")'
              then: >
                True, then False; after the first call seeds() is [],
                has_address is True and code_of returns the exact bytes of
                code_belle.hex; the add_seed succeeds and seeds() has 1 entry
                labelled "BELLE again"
              ref: 'phase 12: seed remove keeps the code and address rows'
            - given: 'a fresh db, and then that db with code_belle.hex stored at 0x34c6… but not seeded'
              when: 'remove_seed("0x34c6211621f2763c60eb007dc2ae91090a2d22f6") is called on each'
              then: 'False both times, no exception, and the codes and addresses row counts unchanged'
            - given: >
                the four-address db of Store Codes And Contracts example 14
                after its set_implementation calls (0x0c01…2cf8 ->
                0x72b9…393b whose code is stored, 0x069c…5ea -> 0x1111…1111
                which is not stored)
              when: >
                add_seed("0x0c0105334a50db16b51b2911c9956539753a2cf8", "proxy-seed"),
                add_seed("0x069c4c579671f8c120b1327a73217d01ea2ec5ea", "dangling") and
                add_seed("0x72b971717e088b59f26d4236be222adb6acd393b", "impl-seed") are called
              then: >
                seeds() has 3 entries sorted by address: 0x069c…5ea "dangling"
                with code_id 30ccc4ce49c00fae11d7118fc244f29a13788fb32cd4022ee69acc2f15c0e2f5
                (its own, the proxy's code), 0x0c01…2cf8 "proxy-seed" with
                code_id 148d598b091197e8547a99bb62fb69d3003cfcad58124c5d847b1de213ecbf28
                (the implementation's), 0x72b9…393b "impl-seed" with the same
                148d598b…cbf28
              ref: 'phase 14: a seed on a proxy seeds through its implementation; code_ids from fingerprint() of the two fixtures'
        - name: Budget Ledger
          description: >
            spend(day, method, credits) adds credits to the ledger of a UTC
            day ("YYYY-MM-DD"); spent(day) -> int is the day's total.
          steps:
            - modifies: Code Database
          examples:
            - given: 'a fresh db'
              when: 'spend("2026-09-28", "eth_getBlockReceipts", 1000) once and spend("2026-09-28", "eth_getCode", 80) 206 times'
              then: 'spent("2026-09-28") is 17480 and spent("2026-09-29") is 0'
              ref: '206 candidates of block 26077729; prices 1000 and 80 from Infura''s credit table'
        - name: Base Counts
          description: >
            The read-only aggregates a report needs and no other reader
            gives. counts() -> dict with exactly the keys addresses,
            addresses_with_code, addresses_without_code, codes, blocks;
            ledger_days() -> list of {day, credits} over the whole ledger,
            sorted by day ascending. Phase 15: origin_counts(since_block=None)
            -> dict mapping each origin text found in addresses to the
            number of rows carrying it, a NULL origin counted under
            "unknown"; with since_block given only the rows whose block >=
            since_block count. Every addresses row counts, with or without
            code. One SELECT ... GROUP BY; an empty database gives {}.
          behavior: >
            counts()["blocks"] is the number of distinct block values in the
            addresses table, not their span. addresses_without_code counts
            the rows whose code_id is NULL (accounts whose eth_getCode was
            "0x"), and addresses equals addresses_with_code plus
            addresses_without_code. codes is the number of rows of the codes
            table, the same length as fingerprints(). ledger_days() sums the
            credits of every method of one day into one int per day and
            gives [] on an empty ledger. On an empty database counts()
            gives 0 under all five keys. Both are pure reads: they write
            nothing and commit nothing, and every value they return is an
            int.
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - reads: Code Database
          examples:
            - given: 'a store filled from codes_26077729.json (206 addresses of block 26077729, 59 of them without code)'
              when: 'counts() is called'
              then: 'addresses 206, addresses_with_code 147, addresses_without_code 59, codes 130, blocks 1'
              ref: 'counted over codes_26077729.json'
            - given: 'a fresh db, then spend("2026-09-28", "eth_getBlockReceipts", 1000) and spend("2026-09-28", "eth_getCode", 80) twice, then spend("2026-09-27", "eth_blockNumber", 80)'
              when: 'ledger_days() is called on the fresh db and after the spends'
              then: '[] first; then [{"day": "2026-09-27", "credits": 80}, {"day": "2026-09-28", "credits": 1160}]'
            - given: 'an empty database'
              when: 'counts() is called'
              then: 'all five keys are 0'
            - given: >
                a fresh db, then put_address("0x00000000000000000000000000000000000000a1",
                None, 100, "created"), put_address("0x00000000000000000000000000000000000000a2",
                None, 200, "seen"), put_address("0x00000000000000000000000000000000000000a3",
                None, 300) and put_address("0x00000000000000000000000000000000000000a4",
                None, 300, "seen")
              when: 'origin_counts() is called on the fresh db, then origin_counts(), origin_counts(since_block=200) and origin_counts(since_block=301) after the puts'
              then: >
                {} first; then {"created": 1, "seen": 2, "unknown": 1};
                {"seen": 2, "unknown": 1}; {}
              ref: 'phase 15: the dashboard summary counts origins in one GROUP BY'
        - name: Record Events
          description: >
            The persistent record of the live stream (phase 15): every
            ALERT and UPGRADE that follow_chain hands to its sinks, so the
            dashboard can show them after the listener's stdout is gone.
            add_events(events) writes a list of Event dicts in one
            transaction; events(after_id=0, limit=100) -> list of Event,
            newest first; event_counts() -> dict of counts per kind and per
            seed.
          behavior: >
            Each element given to add_events is a dict with kind ("ALERT"
            or "UPGRADE"), block (int) and at (str), plus the fields of its
            kind: an ALERT carries address, seed_address, label, score,
            origin (the alert dict of ingest as is); an UPGRADE carries
            address, old_impl, new_impl. A key the element lacks is stored
            NULL; extra keys are ignored. Addresses (address, seed_address,
            old_impl, new_impl) are stored lowercase. The rows get
            increasing ids in list order (INSERT without an id; id is
            INTEGER PRIMARY KEY). The whole list is one transaction: a kind
            other than ALERT or UPGRADE anywhere in it raises ValueError
            and nothing of the list is written. add_events([]) writes
            nothing and does not raise. events(after_id, limit) returns the
            newest `limit` rows whose id > after_id, ordered by id
            descending, each an Event with exactly the eleven keys; a row's
            NULL reads back as None, score as a float. event_counts() gives
            {"kinds": {"ALERT": a, "UPGRADE": u}, "seeds": [{"label",
            "seed_address", "count"}, ...]}: kinds has both keys always
            (0 when absent); seeds groups the ALERT rows by (seed_address,
            label), sorted by count descending, then label, then
            seed_address. Nothing in the store deletes or updates an event.
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - modifies: Code Database
          examples:
            - given: >
                a fresh temp db and the two events
                {"kind": "ALERT", "block": 26077729, "at": "2026-10-02T08:00:00Z",
                "address": "0x1807090DD15A6F58E00FD769E32EBF20EE610385",
                "seed_address": "0x34c6211621f2763c60eb007dc2ae91090a2d22f6",
                "label": "BELLE honeypot", "score": 0.8666666666666667,
                "origin": "seen"} and {"kind": "UPGRADE", "block": 26077729,
                "at": "2026-10-02T08:00:00Z", "address":
                "0x0c0105334a50db16b51b2911c9956539753a2cf8", "old_impl":
                "0x72b971717e088b59f26d4236be222adb6acd393b", "new_impl":
                "0xe440cc08a71694c8229323803f59024e3144630e"}
              when: 'add_events([alert, upgrade]) is called, then events()'
              then: >
                exactly two events, ids 2 then 1: {"id": 2, "kind": "UPGRADE",
                "block": 26077729, "at": "2026-10-02T08:00:00Z", "address":
                "0x0c0105334a50db16b51b2911c9956539753a2cf8", "seed_address":
                None, "label": None, "score": None, "origin": None, "old_impl":
                "0x72b971717e088b59f26d4236be222adb6acd393b", "new_impl":
                "0xe440cc08a71694c8229323803f59024e3144630e"} and {"id": 1,
                "kind": "ALERT", "block": 26077729, "at": "2026-10-02T08:00:00Z",
                "address": "0x1807090dd15a6f58e00fd769e32ebf20ee610385",
                "seed_address": "0x34c6211621f2763c60eb007dc2ae91090a2d22f6",
                "label": "BELLE honeypot", "score": 0.8666666666666667,
                "origin": "seen", "old_impl": None, "new_impl": None}; the same
                after the db is closed and reopened
              ref: 'phase 15; the alert is the one follow_chain finds in Follow Chain example 5 (score 13/15)'
            - given: 'a fresh temp db and five ALERT events with blocks 1, 2, 3, 4, 5 (the other fields as in example 1), added in one add_events call'
              when: 'events(), events(limit=3), events(after_id=2), events(after_id=2, limit=2) and events(after_id=5) are called'
              then: 'ids [5, 4, 3, 2, 1], [5, 4, 3], [5, 4, 3], [5, 4], []; the block of each event equals its id'
              ref: 'phase 15: newest first, after_id is exclusive'
            - given: 'a fresh temp db'
              when: 'event_counts() is called, then add_events of three ALERT events -- seed_address 0x34c6211621f2763c60eb007dc2ae91090a2d22f6 label "BELLE honeypot" twice, seed_address 0x1111111111111111111111111111111111111111 label "impl copy seed" once -- and one UPGRADE event, then event_counts() again'
              then: >
                {"kinds": {"ALERT": 0, "UPGRADE": 0}, "seeds": []} first; then
                {"kinds": {"ALERT": 3, "UPGRADE": 1}, "seeds": [{"label": "BELLE
                honeypot", "seed_address": "0x34c6211621f2763c60eb007dc2ae91090a2d22f6",
                "count": 2}, {"label": "impl copy seed", "seed_address":
                "0x1111111111111111111111111111111111111111", "count": 1}]}
              ref: 'phase 15: alerts per seed for the dashboard summary'
            - given: 'a fresh temp db holding one event (example 1 alert)'
              when: 'add_events is called with [a valid ALERT, {"kind": "BOGUS", "block": 1, "at": "2026-10-02T08:00:00Z"}]'
              then: 'ValueError; events() still holds exactly the one earlier event'
              ref: 'phase 15: one transaction per list'
            - given: 'a fresh temp db'
              when: 'add_events([]) is called'
              then: 'no exception; events() is [] and event_counts()["kinds"] is {"ALERT": 0, "UPGRADE": 0}'
        - name: Open Read Only
          description: >
            Store(path, readonly=True) (phase 15) opens an existing database
            for reading only, through the sqlite URI
            "file:" + path + "?mode=ro" (sqlite3.connect(..., uri=True); the
            store does not import urllib -- No Network In Core -- so a path
            holding "?", "#" or "%" is not supported read-only): it never
            writes, never migrates, never changes the journal mode and
            never runs the std_proxy fill. The dashboard opens one per
            request.
          behavior: >
            Every write method -- put_code, put_address, set_implementation,
            set_progress, add_seed, remove_seed, spend, add_events -- raises
            ReadOnlyStoreError (ethsc.store.ReadOnlyStoreError, a subclass
            of Exception) before touching the file. Every read method works
            as on a writable open. A read-only open tolerates exactly the
            three newest schema additions missing from an older file,
            because it cannot add them: no events table -- events() gives
            [], event_counts() gives {"kinds": {"ALERT": 0, "UPGRADE": 0},
            "seeds": []}; no progress.updated_at -- progress_at() gives
            None; no addresses.implementation -- implementation(address)
            gives None and implementations() maps every standard-proxy
            address to {"implementation": None, "code_id": None}. A file
            older than phase 13 (no addresses.origin or codes.std_proxy) is
            not supported read-only: a read may raise sqlite3 errors. A
            path that does not exist raises sqlite3.OperationalError from
            the constructor and creates no file. Opening a file read-only
            leaves it byte-identical, and a non-WAL file gets no -wal or
            -shm file next to it. (On a WAL file with no writer attached,
            SQLite itself leaves an empty -wal and a -shm next to it after a
            read-only read; that is SQLite's behaviour, not a write of the
            database, and is allowed.)
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - reads: Code Database
          examples:
            - given: 'a store filled from codes_26077729.json at block 26077729 (block_store()), set_progress(26077729), closed'
              when: 'Store(path, readonly=True) is opened; counts(), get_progress(), len(fingerprints()), origins() length, events() are read; then each of the eight write methods is called once with valid arguments'
              then: >
                counts() is addresses 206, addresses_with_code 147,
                addresses_without_code 59, codes 130, blocks 1;
                get_progress() 26077729; 130 fingerprints; 206 origins;
                events() []; every write raises ReadOnlyStoreError; after
                close, a writable Store(path) still gives counts()
                addresses 206 and seeds() []
              ref: 'phase 15'
            - given: >
                a phase-13 database made by plain INSERTs as in Store
                example 15 (addresses without implementation, progress (key,
                block) holding ("progress", 26077729), no events table,
                journal mode delete) of the 206 addresses of
                codes_26077729.json; the sha256 of the file and the listing
                of its directory taken before
              when: 'Store(path, readonly=True) is opened; get_progress, progress_at, events, event_counts, implementations, implementation("0x0000000000000000000000000000000000000001"), origins and counts are read; the store is closed'
              then: >
                get_progress() 26077729, progress_at() None, events() [],
                event_counts() {"kinds": {"ALERT": 0, "UPGRADE": 0}, "seeds":
                []}, implementations() 20 entries every one
                {"implementation": None, "code_id": None},
                implementation(...) None, origins() 206 entries all
                "unknown", counts()["addresses"] 206; afterwards the sha256
                of the file and the directory listing are unchanged (no
                -wal, -shm or -journal file)
              ref: 'phase 15; the 01.10 night2 base is a phase-13 file'
            - given: 'a path in a fresh temp directory where no file exists'
              when: 'Store(path, readonly=True) is called'
              then: 'sqlite3.OperationalError; the directory is still empty'
            - given: 'a writable Store W on a fresh temp db and a Store(path, readonly=True) R on the same file, both open'
              when: 'W.add_events([the ALERT of Record Events example 1]) and W.set_progress(26077729) run, then R.events(), R.get_progress() and R.progress_at() are read'
              then: 'R sees the event (one element, id 1), progress 26077729 and a non-None progress_at -- no "database is locked" either way'
              ref: 'phase 15: WAL, the listener writes while the dashboard reads'
      dataObjects:
        - name: Code Database
          description: One SQLite file.
          schema: >
            codes(code_id TEXT PRIMARY KEY, size INTEGER, skeleton_hash TEXT,
            selectors TEXT (JSON list), proxy_kind TEXT, proxy_target TEXT,
            code BLOB, std_proxy INTEGER); addresses(address TEXT PRIMARY KEY,
            code_id TEXT NULL, block INTEGER, origin TEXT, implementation
            TEXT), index addresses_code_id on
            addresses(code_id); progress(key TEXT PRIMARY KEY, block INTEGER,
            updated_at TEXT);
            seeds(address TEXT PRIMARY KEY, code_id TEXT, label TEXT);
            ledger(day TEXT, method TEXT, credits INTEGER);
            events(id INTEGER PRIMARY KEY, kind TEXT, block INTEGER, at TEXT,
            address TEXT, seed_address TEXT, label TEXT, score REAL, origin
            TEXT, old_impl TEXT, new_impl TEXT). journal_mode WAL (phase 15).
        - name: Event
          description: >
            One row of the events table as read back (phase 15): a dict with
            exactly the keys id (int), kind ("ALERT" or "UPGRADE"), block
            (int), at (str "YYYY-MM-DDTHH:MM:SSZ", UTC), address,
            seed_address, label, score (float), origin, old_impl, new_impl;
            an ALERT has old_impl and new_impl None, an UPGRADE has
            seed_address, label, score and origin None.
    - name: cluster
      description: >
        Clusters and similarity search over the store: L0 identical code, L1
        identical skeleton, proxy by target, L2 similarity by full scan, and
        the watchlist check for a new code.
      functions:
        - name: Build Clusters
          description: >
            build_clusters(store) -> list of Cluster: L0 per code_id with >= 2
            addresses; L1 per skeleton_hash with >= 2 distinct code_id; proxy
            per eip1167 (kind, target) with >= 2 addresses; eip7702 per
            (kind, target) of the EIP-7702 delegations with >= 2 addresses.
            Proxy codes enter only their proxy/eip7702 clusters. Phase 14:
            impl per implementation address of the standard proxies with >= 2
            proxies, from store.implementations().
          behavior: >
            Cluster = {level: "L0" | "L1" | "proxy" | "eip7702" | "impl", key,
            members: sorted lowercase addresses}; key is the code_id, the
            skeleton_hash, "<kind>:<target>", or the implementation address.
            L0 and L1 are built from non-proxy codes
            only; a proxy code never enters L0 or L1, however many addresses it
            has. L1 members are the addresses of all the codes sharing the
            skeleton_hash. An EIP-1167 clone goes to a "proxy" cluster; an
            EIP-7702 delegation goes to its own "eip7702" cluster, kept apart
            from contract proxies -- a 7702 designator is a delegating EOA, a
            wallet, not a deployed contract, and on the live 30.09 base the
            largest clusters were 7702 delegations (800, 450, 176 addresses)
            that drowned out the contract clusters. Each cluster counts the
            addresses of every code with that (kind, target) pair. Addresses
            without code are never members. The list is sorted by member count
            descending, then level (L0, L1, proxy, eip7702, impl), then key;
            insertion order does not matter. Reads the store through
            fingerprints(), code_by_id(), addresses_of() and
            implementations() only.
            impl (phase 14): one cluster per implementation address (the
            value of the implementation column, lowercase, as the key) with
            >= 2 standard-proxy addresses pointing at it; the members are
            those proxy addresses, never the implementation address itself;
            a beacon proxy counts under its beacon address the same way
            (the column holds whichever the ingest found). A standard proxy
            still enters its L0 (identical bytecode) and L1 clusters as
            before -- the impl level is an addition, so a proxy may be a
            member of an L0 cluster and of an impl cluster. The level ranks
            last, after eip7702. A proxy with NULL implementation is in no
            impl cluster.
          guardrails: [Deterministic Output]
          steps:
            - uses: store
            - produces: Cluster
          examples:
            - given: 'a store filled from codes_26077729.json (206 candidates: 59 without code, 147 with code, 130 distinct code_id)'
              when: 'build_clusters is called'
              then: >
                7 L0 clusters (sizes 4, 2, 2, 2, 2, 2, 2), 2 L1 clusters (8
                UniswapV3Pool deployments, 5 LaunchToken deployments), 2 proxy
                clusters (eip1167 0x4181f370… with 3, eip1167 0x8b72b9b8… with
                2) and 4 eip7702 clusters (0xd2e28229… with 3, and 0x0000fb7702…,
                0x490aac77… and 0x63c0c19a… each with 2)
              ref: 'counted over codes_26077729.json; the 7702 delegations are now a level of their own'
            - given: 'the same store'
              when: 'build_clusters is called'
              then: 'the first cluster is L1 with 8 members including 0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640; the first L0 cluster has key 8b5db55f… and 4 members'
            - given: 'the same codes inserted in reverse order'
              when: 'build_clusters is called'
              then: 'the result is equal'
              ref: 'Deterministic Output'
            - given: >
                the store from codes_26077729.json with set_implementation
                applied to its 20 standard-proxy addresses from
                storage_26077729.json (17 of them with the implementation slot
                set, 3 with the beacon slot set; two of the beacon proxies,
                0xc9eef266834730340a55b6cc24621b31baf55581 and
                0xf6b1117ec07684d3958cad8beb1b302bfd21103f, share the beacon
                0x985462c9aa4d6c3ad59ae6e1e9c0c11347ed1598; every other
                implementation is unique)
              when: 'build_clusters is called'
              then: >
                the 15 clusters of example 1 unchanged and in the same order,
                plus exactly one impl cluster, last of all: {"level": "impl",
                "key": "0x985462c9aa4d6c3ad59ae6e1e9c0c11347ed1598",
                "members": ["0xc9eef266834730340a55b6cc24621b31baf55581",
                "0xf6b1117ec07684d3958cad8beb1b302bfd21103f"]}; 16 clusters
              ref: 'phase 14; slots of the 20 std-proxy addresses read on the public node 2026-10-01 (storage_26077729.json)'
            - given: >
                a store holding code_proxy_seed_0c010533.hex at
                0x0c0105334a50db16b51b2911c9956539753a2cf8 and at
                0x069c4c579671f8c120b1327a73217d01ea2ec5ea, both with
                implementation 0x72b971717e088b59f26d4236be222adb6acd393b, and
                code_impl_72b97171.hex at that implementation address
              when: 'build_clusters is called, and again on the same store built in reverse insertion order'
              then: >
                exactly [{"level": "L0", "key":
                "30ccc4ce49c00fae11d7118fc244f29a13788fb32cd4022ee69acc2f15c0e2f5",
                "members": ["0x069c4c579671f8c120b1327a73217d01ea2ec5ea",
                "0x0c0105334a50db16b51b2911c9956539753a2cf8"]}, {"level":
                "impl", "key": "0x72b971717e088b59f26d4236be222adb6acd393b",
                "members": ["0x069c4c579671f8c120b1327a73217d01ea2ec5ea",
                "0x0c0105334a50db16b51b2911c9956539753a2cf8"]}] both times --
                the implementation address is not a member
              ref: 'phase 14; two live proxies of the same implementation'
        - name: Find Similar
          description: >
            find_similar(store, address, min_score=0.8) -> list of (address,
            score) for every other stored address with code whose similarity
            to address's code is >= min_score; sorted by score descending,
            then address.
          behavior: >
            Full scan: one score per distinct code_id, fanned out to its
            addresses. Returns tuples (address, score) with score the float
            from similarity, unrounded. Since phase 11 the score is
            score_fingerprints(query fingerprint, fp) over store.fingerprints():
            the query fingerprint is fingerprint(store.code_of(address)), and
            the stored codes are never loaded -- no code_by_id, no similarity
            (live 30.09 copy: 241 s -> under 2 s, same output). The queried address itself is
            excluded; the other addresses of the same code come back with
            1.0. The query address may be in any case. Unknown address or one
            without code gives [].
            Through the implementation (phase 14): a standard proxy whose
            implementations() entry has a code_id is scored by the
            fingerprint of that code_id instead of its own, on both sides --
            as the query (the query fingerprint is the implementation's) and
            as a stored address (it comes back with the score of its
            implementation's fingerprint). A standard proxy without a
            resolved implementation keeps its own fingerprint and so scores
            0.0 (phase 9 stands). The implementation address itself is an
            ordinary stored address: against a proxy that delegates to it,
            it scores 1.0. The result still excludes the query address, is
            still sorted by score descending then address, and reads the
            store through code_of(), fingerprints(), addresses_of() and
            implementations() only.
          guardrails: [Deterministic Output]
          steps:
            - uses: fingerprint
            - uses: store
          examples:
            - given: 'the store from codes_26077729.json'
              when: 'find_similar(store, "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc")'
              then: >
                0x22052a1a0f5a3d2839d71c458f177e68b0e73963,
                0x2621cc0b3f3c079c1db0e80794aa24976f0b9e3c,
                0x3041cbd36888becc7bbcbc0045e3b1f144466f5f with 1.0, then
                0xcf6daab95c476106eca715d48de4b13287ffdeaa with 26/32 (0.8125)
              ref: '0xcf6daab9… is a UniswapV2Pair built with solc 0.6.12 (Sourcify match); selector diff counted'
            - given: 'a store with code_belle.hex and its four copies code_belle_copy_*.hex at their addresses'
              when: 'find_similar(store, "0x34c6211621f2763c60eb007dc2ae91090a2d22f6")'
              then: 'the 4 copies, each 13/15, in address order 0x1807…, 0x2141…, 0x46ca…, 0x6411…'
              ref: 'deployer 0xf80f6fa4… nonces 0, 1, 5, 13 (CREATE addresses); selector diff'
            - given: >
                the store of Build Clusters example 5 (code_proxy_seed_0c010533.hex at
                0x0c0105334a50db16b51b2911c9956539753a2cf8 and
                0x069c4c579671f8c120b1327a73217d01ea2ec5ea, both with implementation
                0x72b971717e088b59f26d4236be222adb6acd393b, code_impl_72b97171.hex
                there), and a second store made the same way but without
                set_implementation for 0x069c…5ea
              when: >
                find_similar(store, "0x0c0105334a50db16b51b2911c9956539753a2cf8") and
                find_similar(store, "0x72b971717e088b59f26d4236be222adb6acd393b") on the
                first store; find_similar of 0x0c01…2cf8 and of 0x069c…5ea on the second
              then: >
                first store: [("0x069c4c579671f8c120b1327a73217d01ea2ec5ea", 1.0),
                ("0x72b971717e088b59f26d4236be222adb6acd393b", 1.0)] and
                [("0x069c4c579671f8c120b1327a73217d01ea2ec5ea", 1.0),
                ("0x0c0105334a50db16b51b2911c9956539753a2cf8", 1.0)]; second
                store: [("0x72b971717e088b59f26d4236be222adb6acd393b", 1.0)]
                for 0x0c01…2cf8 (the unresolved sibling scores 0.0 and is
                absent) and [] for 0x069c…5ea
              ref: 'phase 14; a proxy without a resolved implementation keeps phase 9'
        - name: Match Watchlist
          description: >
            match_watchlist(store, code, min_score=0.8) -> list of Alert
            {seed_address, label, score} for every seed whose code has
            similarity >= min_score with code; sorted by score descending,
            then seed_address.
          behavior: >
            One similarity per seed from store.seeds(); score is the float
            from similarity, unrounded. With no seeds, on b"" and on garbage
            bytes it returns [] or a list, never an exception. Since phase 11
            the code is fingerprinted once, and each seed is scored by
            score_fingerprints against the element of store.fingerprints()
            with the seed's code_id; no code_by_id, no similarity. A seed
            whose code_id has no fingerprint is skipped. fingerprint(b"") is
            None and scores 0.0 like similarity(b"", code): at min_score 0.0
            empty code still gives one 0.0 alert per seed, as before.
            Phase 14 changes nothing in match_watchlist itself: it scores
            the bytes it is given against the seed fingerprints; a seed
            added on a proxy carries its implementation's code_id (Manage
            Watchlist), and Ingest Block hands it the implementation's
            bytes on behalf of a proxy, so a proxy's own bytes still score
            0.0 against everything.
          guardrails: [Deterministic Output, Tolerant Parser]
          steps:
            - uses: store
            - produces: Alert
          examples:
            - given: 'a store with seed BELLE (0x34c6…, "BELLE honeypot")'
              when: 'match_watchlist(store, bytes of code_belle_copy_1807090d.hex)'
              then: 'one alert, label "BELLE honeypot", score 13/15'
            - given: 'the same store'
              when: 'match_watchlist(store, bytes of code_weth9.hex)'
              then: '[] (WETH9 vs BELLE is 9/16 = 0.5625)'
            - given: 'a store with no seeds, and then empty code b"" against the BELLE seed'
              when: 'match_watchlist is called'
              then: '[] both times'
              ref: 'Tolerant Parser'
            - given: >
                the store of Build Clusters example 5 with
                add_seed("0x0c0105334a50db16b51b2911c9956539753a2cf8", "proxy-seed")
              when: 'match_watchlist(store, bytes of code_impl_72b97171.hex), then match_watchlist(store, bytes of code_proxy_seed_0c010533.hex)'
              then: >
                one alert {"seed_address": "0x0c0105334a50db16b51b2911c9956539753a2cf8",
                "label": "proxy-seed", "score": 1.0} for the implementation
                bytes; [] for the proxy bytes
              ref: 'phase 14: the seed carries the implementation code_id; a proxy''s own bytes still score 0.0'
        - name: Recheck Watchlist
          description: >
            recheck_watchlist(store, min_score=0.8, seed_addresses=None) ->
            list of Alert carrying address: every stored address whose code
            matches a seed of the watchlist, over the whole store, without
            the network. seed_addresses restricts the check to those seeds
            (any case, unknown ones simply match nothing); None means every
            seed of store.seeds(). This is what makes a copy of a scam
            already in the database visible: match_watchlist only ever sees
            a code arriving after the seed.
          behavior: >
            Each Alert has exactly the keys address, seed_address, label,
            score and origin (phase 13); address is the matching stored
            address, lowercase, score is the float from similarity,
            unrounded, and origin is that address's origin as
            store.origins() gives it -- "created", "seen", "fetched", or
            "unknown" for a row stored before phase 13. origins() is read
            once per call, never once per alert; the alert order and the
            scores do not depend on origin. One similarity per
            (code_id, seed) pair, fanned out to addresses_of(code_id): the
            cost is distinct codes times seeds, never addresses times seeds.
            Since phase 11 each (code_id, seed) pair is scored by
            score_fingerprints over two elements of store.fingerprints(); no
            code is loaded (live 30.09 copy: 29 s -> under 2 s, 15018 pairs,
            0 mismatches against similarity).
            A seed never alerts on itself -- the single pair address ==
            seed_address is dropped -- while every other address of the
            seed's own code alerts with score 1.0, unless that code is an
            opaque proxy: a standard EIP-1967/UUPS/Beacon proxy or a
            selector-less code scores 0.0 even against its own byte-identical
            copies (similarity rule 2), so such a seed alerts on nothing. This
            is by design: on the live 30.09 base the TransparentUpgradeableProxy
            seed produced 380 false alerts at 1.0 against unrelated proxies;
            after this phase it produces none, while byte-identical proxies are
            still grouped by their code_id in an L0 cluster.
            Through the implementation (phase 14): a stored standard proxy
            whose implementations() entry has a code_id is scored by the
            fingerprint of that code_id instead of its own, so it alerts
            against a seed its implementation matches (score 1.0 when the
            seed is that implementation, or another proxy of it); a seed on
            a proxy carries the implementation's code_id (Manage Watchlist)
            and so alerts on the implementation address and on every other
            proxy resolved to it. A proxy without a resolved implementation
            keeps phase 9: it alerts on nothing and nothing alerts on it
            through its bytes. Scoring stays per distinct (effective
            code_id, seed) pair fanned out to addresses -- the proxies of
            one implementation are scored once -- and the store is read
            through seeds(), fingerprints(), addresses_of(), origins() and
            implementations() only; origin "impl" is read back like any
            other. Addresses stored
            without code are never checked. The list is sorted by address ascending,
            then score descending, then seed_address ascending; it does not
            depend on insertion order, and two calls on the same store give
            equal lists. No seeds, an empty store, or seed_addresses naming
            nothing known give []. Reads the store through seeds(),
            fingerprints(), addresses_of() and origins() only (phase 11: no
            code_by_id).
          guardrails: [Deterministic Output, No Network In Core]
          steps:
            - uses: store
            - uses: fingerprint
            - produces: Alert
          examples:
            - given: 'a store filled from codes_26077729.json, seed 0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc labelled "UniV2 pair seed"'
              when: 'recheck_watchlist(store) is called'
              then: >
                4 alerts, addresses ascending: 0x22052a1a…, 0x2621cc0b… and
                0x3041cbd3… with 1.0, then 0xcf6daab9… with 26/32 (0.8125);
                the seed address itself is absent
              ref: 'the three other UniswapV2Pair addresses of the same code plus the solc 0.6.12 pair of Find Similar'
            - given: 'the same store'
              when: 'recheck_watchlist(store, min_score=1.0), and then with seed_addresses=["0xB4E16D0168E52D35CACD2C6185B44281EC28C9DC"]'
              then: 'the three 1.0 alerts only; and the same 4 alerts as the default call (the seed address may come in any case)'
            - given: 'a store holding code_belle.hex at 0x34c6… seeded "BELLE honeypot" and its four copies code_belle_copy_*.hex at their addresses'
              when: 'recheck_watchlist(store) is called twice'
              then: >
                both times the same 4 alerts, each 13/15 (0.8667), in address
                order 0x1807…, 0x2141…, 0x46ca…, 0x6411…, label "BELLE
                honeypot"
              ref: 'Deterministic Output; the copies were already in the store when the seed was added'
            - given: 'that store with no seeds at all, and then with seed_addresses=["0x1111111111111111111111111111111111111111"]'
              when: 'recheck_watchlist is called'
              then: '[] both times'
            - given: 'a store holding code_proxy_seed_0c010533.hex at two addresses A and B, seeded at A as "TransparentUpgradeableProxy", plus code_proxy_046eee2c.hex at a third address'
              when: 'recheck_watchlist(store) is called'
              then: '[] -- a standard-proxy seed matches nothing: not the other stored copy of its own bytecode (B), not the distinct standard proxy'
              ref: 'similarity rule 2; the live 30.09 false positive, reduced to zero'
            - given: >
                the store from codes_26077729.json with seed
                0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc "UniV2 pair seed", its
                code_by_id replaced by a stub that raises, and
                ethsc.cluster.similarity replaced by a stub that raises
              when: 'recheck_watchlist(store), find_similar(store, "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc") and match_watchlist(store, bytes of code_univ2_usdc_weth.hex) are called'
              then: >
                the same 4 alerts as example 1; the same 4 results as Find
                Similar example 1 (0x22052a1a0f5a3d2839d71c458f177e68b0e73963,
                0x2621cc0b3f3c079c1db0e80794aa24976f0b9e3c,
                0x3041cbd36888becc7bbcbc0045e3b1f144466f5f with 1.0, then
                0xcf6daab95c476106eca715d48de4b13287ffdeaa with 0.8125); one
                alert, seed 0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc, score
                1.0 -- no stub is ever called
              ref: 'phase 11: scores come from fingerprints() and score_fingerprints only'
            - given: 'a store with seed BELLE (0x34c6211621f2763c60eb007dc2ae91090a2d22f6, "BELLE honeypot")'
              when: 'match_watchlist(store, b"", min_score=0.0)'
              then: 'one alert, seed 0x34c6211621f2763c60eb007dc2ae91090a2d22f6, score 0.0 -- unchanged from before phase 11'
              ref: 'score_fingerprints(None, fp) == 0.0 == similarity(b"", code)'
            - given: >
                a store filled by ingest_block(26077729, receipts_26077729.json, …)
                with a fake get_code serving codes_26077729.json, then seed
                0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc "UniV2 pair seed";
                and the store of example 1 (filled by put_address, no origin)
                with the same seed
              when: 'recheck_watchlist(store) is called on each'
              then: >
                the same 4 alerts as example 1 (0x22052a1a0f5a3d2839d71c458f177e68b0e73963,
                0x2621cc0b3f3c079c1db0e80794aa24976f0b9e3c,
                0x3041cbd36888becc7bbcbc0045e3b1f144466f5f with 1.0, then
                0xcf6daab95c476106eca715d48de4b13287ffdeaa with 0.8125), each
                with exactly the five keys: origin "seen" on every alert of the
                ingested store, "unknown" on every alert of the put_address
                store; store.origins() was called once per recheck_watchlist call
              ref: 'phase 13'
            - given: >
                the store of Build Clusters example 5 (0x0c01…2cf8 origin
                "fetched" and 0x069c…5ea origin "seen", both resolved to
                0x72b9…393b, whose code is stored with origin "impl") with
                add_seed("0x72b971717e088b59f26d4236be222adb6acd393b", "impl-seed")
              when: 'recheck_watchlist(store) is called twice'
              then: >
                both times exactly [{"address": "0x069c4c579671f8c120b1327a73217d01ea2ec5ea",
                "seed_address": "0x72b971717e088b59f26d4236be222adb6acd393b", "label":
                "impl-seed", "score": 1.0, "origin": "seen"}, {"address":
                "0x0c0105334a50db16b51b2911c9956539753a2cf8", "seed_address":
                "0x72b971717e088b59f26d4236be222adb6acd393b", "label": "impl-seed",
                "score": 1.0, "origin": "fetched"}]
              ref: 'phase 14: the proxies of a seeded implementation alert at 1.0'
            - given: 'the same store seeded instead with add_seed("0x0c0105334a50db16b51b2911c9956539753a2cf8", "proxy-seed")'
              when: 'recheck_watchlist(store) is called'
              then: >
                exactly [{"address": "0x069c4c579671f8c120b1327a73217d01ea2ec5ea",
                "seed_address": "0x0c0105334a50db16b51b2911c9956539753a2cf8", "label":
                "proxy-seed", "score": 1.0, "origin": "seen"}, {"address":
                "0x72b971717e088b59f26d4236be222adb6acd393b", "seed_address":
                "0x0c0105334a50db16b51b2911c9956539753a2cf8", "label": "proxy-seed",
                "score": 1.0, "origin": "impl"}]; the seed itself is absent
              ref: 'phase 14: a proxy seed alerts on its implementation and on the other proxies of it'
            - given: >
                the second store of Find Similar example 3 (0x069c…5ea with NULL
                implementation), seeded "impl-seed" at 0x72b9…393b; and the same store
                seeded "dangling" at 0x069c…5ea instead
              when: 'recheck_watchlist(store) is called on each'
              then: >
                one alert for the first: address 0x0c0105334a50db16b51b2911c9956539753a2cf8,
                seed 0x72b971717e088b59f26d4236be222adb6acd393b, score 1.0 (the
                unresolved sibling is absent); [] for the second
              ref: 'phase 14; phase 9 stands for a proxy without a resolved implementation'
      dataObjects:
        - name: Cluster
          description: One group of addresses.
          schema:
            level: '"L0" | "L1" | "proxy" | "eip7702" | "impl"'
            key: code_id, skeleton_hash, "<kind>:<target>", or the implementation address (impl)
            members: sorted lowercase addresses
        - name: Alert
          description: >
            A code matching a seed, as match_watchlist returns it. Ingest
            Block adds the key address (the new address whose code matched)
            to every alert it passes on; Recheck Watchlist returns alerts
            with that key already set (the stored address that matched), so
            a cli record is written the same way whichever produced it.
            Phase 13: both also set origin, the origin of that address.
          schema:
            seed_address: str
            label: str
            score: float
            address: 'str -- added by Ingest Block, returned by Recheck Watchlist'
            origin: '"created" | "seen" | "fetched" | "impl" | "unknown" -- set by Ingest Block (created, seen, impl) and Recheck Watchlist (any, from store.origins())'
    - name: rpc
      description: >
        The only network module: a minimal JSON-RPC client over an injected
        transport, with retry and backoff and credit accounting.
      functions:
        - name: RPC Client
          description: >
            RpcClient(url, transport=None, sleep=time.sleep, prices=None,
            on_spend=None, max_retries=3).call(method, params) -> result.
            transport(url, body: bytes) -> (status: int, body: bytes); the
            default is a urllib POST. infura_url(env_path=".env") builds
            https://mainnet.infura.io/v3/<key> from INFURA_API_KEY: the
            environment variable wins over the file; no key anywhere raises
            RpcError(None, "INFURA_API_KEY is not set").
          behavior: >
            HTTP 429 and 5xx, and an OSError raised by the transport, are
            retried after sleep(1), sleep(2), sleep(4) (doubling from 1, at
            most max_retries), then RpcError. A JSON-RPC error object raises
            RpcError(code, message) at once, no retry. RpcError.code is the
            JSON-RPC error code, the HTTP status once retries are exhausted,
            or None; the exception chain is suppressed (raise ... from None)
            so the transport's message never travels with it. After a
            successful call on_spend(method, prices[method]) is called once;
            on_spend is a plain hook for the caller and is NOT wired to the
            store ledger (Follow Chain writes the ledger itself, wiring both
            would count twice); prices come from configuration (ethsc/config.py), not from
            code in the client. ethsc/config.py holds PRICES =
            {"eth_blockNumber": 80, "eth_getBlockReceipts": 1000,
            "eth_getCode": 80}; the eth_blockNumber entry carries the comment
            "не подтверждено, сверить с дашбордом" (the other two are from the
            Infura method pages). RpcError text and repr never contain the URL
            or the key. ethsc/config.py also holds PUBLICNODE_URL =
            "https://ethereum-rpc.publicnode.com", the keyless second source
            (phase 10). The default transport sends the header "User-Agent:
            ethsc/0.1" with every request, to both sources: the public node
            answers the urllib default agent (Python-urllib) with HTTP 403
            "error code: 1010" (measured 2026-09-30). A result of null for
            eth_getBlockReceipts is not a block: it is retried on the same
            schedule and under the same max_retries as a 429 or 5xx, is never
            charged to on_spend, and once the retries are exhausted raises
            RpcError(None, "eth_getBlockReceipts returned null"). A null
            result of any other method is returned as is, with no retry.
          requirements: [Offline Tests]
          guardrails: [No Network In Core, Secret Hygiene, Budget Respected]
          steps:
            - produces: RPC Response
          examples:
            - given: >
                a fake transport answering first with tests/fixtures/rpc_429.json
                (status 429, body {"code":-32005,"message":"Too Many Requests",...})
                and then status 200 with {"jsonrpc":"2.0","id":1,"result":<text of code_weth9.hex>}
              when: 'call("eth_getCode", ["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "latest"])'
              then: 'the result equals the text of code_weth9.hex; 2 transport calls; sleep called once, with 1'
              ref: 'rpc_429.json recorded from Infura 2026-09-28'
            - given: 'a fake transport that always answers rpc_429.json'
              when: 'call is made with max_retries=3'
              then: 'RpcError after 4 transport calls; sleeps [1, 2, 4]'
            - given: 'a fake transport answering 200 with {"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"block not found: 0x18deac1"}}'
              when: 'call is made'
              then: 'RpcError with code -32001 after 1 transport call and no sleep'
              ref: 'the error object Infura returned 2026-09-28 for a future block'
            - given: 'url https://mainnet.infura.io/v3/TESTKEY-0000 and a transport raising OSError("boom " + url)'
              when: 'call is made'
              then: 'RpcError whose str and repr do not contain "TESTKEY-0000"'
              ref: 'Secret Hygiene'
            - given: 'prices {"eth_getBlockReceipts": 1000, "eth_getCode": 80} and an on_spend collector'
              when: 'one successful eth_getBlockReceipts and two eth_getCode'
              then: 'the collector sums to 1160'
              ref: 'Infura credit table (eth_getBlockReceipts 1000, eth_getCode 80)'
            - given: 'the default transport with urllib.request.urlopen replaced by a recorder answering 200 {"jsonrpc":"2.0","id":1,"result":"0x1"}'
              when: 'RpcClient("https://ethereum-rpc.publicnode.com").call("eth_chainId", [])'
              then: 'the result is "0x1" and the recorded Request has get_header("User-agent") == "ethsc/0.1" and get_header("Content-type") == "application/json"'
              ref: 'live 2026-09-30: no User-Agent header gives 403 "error code: 1010", "ethsc/0.1" gives 200'
            - given: >
                a fake transport answering status 200 with
                {"jsonrpc":"2.0","id":1,"result":null} twice, then status 200 with the
                text of tests/fixtures/receipts_26077729.json; prices {"eth_getBlockReceipts": 1000}
                and an on_spend collector
              when: 'call("eth_getBlockReceipts", ["0x18dea21"])'
              then: 'a list of 218 receipts; 3 transport calls; sleeps [1, 2]; on_spend called once, with ("eth_getBlockReceipts", 1000)'
              ref: 'live 2026-09-30: block 20000000 answered null 1 time in 10 requests, a block 3 past the head answered null'
            - given: 'a fake transport that always answers 200 {"jsonrpc":"2.0","id":1,"result":null}, max_retries=5 and an on_spend collector'
              when: 'call("eth_getBlockReceipts", ["0x1312d00"])'
              then: 'RpcError with code None and message "eth_getBlockReceipts returned null" after 6 transport calls; sleeps [1, 2, 4, 8, 16]; on_spend never called'
            - given: 'a fake transport answering 200 {"jsonrpc":"2.0","id":1,"result":null} once'
              when: 'call("eth_getCode", ["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "latest"])'
              then: 'the result is None after 1 transport call and no sleep'
              ref: 'only eth_getBlockReceipts treats null as a failure'
            - given: 'the module ethsc.config'
              when: 'PUBLICNODE_URL is read'
              then: 'it equals "https://ethereum-rpc.publicnode.com" and PRICES is exactly {"eth_blockNumber": 80, "eth_getBlockReceipts": 1000, "eth_getCode": 80, "eth_getStorageAt": 80}'
              ref: 'phase 14 adds eth_getStorageAt at 80 credits (Infura credit table, not yet confirmed against the dashboard, like eth_blockNumber)'
      dataObjects:
        - name: RPC Response
          description: >
            A verbatim Infura JSON-RPC response body. Recorded samples:
            tests/fixtures/receipts_26077729.json (eth_getBlockReceipts),
            code_*.hex (eth_getCode result strings), rpc_429.json (status,
            headers, body of a rate-limited request).
          schema: see tests/fixtures/rpc_429.json and receipts_26077729.json
    - name: ingest
      description: >
        From a block to stored codes: candidate discovery from receipts,
        per-block ingest with an injected code fetcher, and chain following
        with resume and budgets.
      functions:
        - name: Discover Candidates
          description: >
            discover_candidates(receipts: list) -> sorted list of distinct
            lowercase addresses: every contractAddress, every to, and every
            logs[].address of the block's receipts. Phase 13:
            candidate_origins(receipts: list) -> dict, the same candidates
            as keys (lowercase), each mapped to its origin: "created" when
            the address is the contractAddress of a receipt of the block,
            else "seen" (it came only as a to or a logs[].address).
          behavior: >
            null to and null contractAddress are skipped; from is not a
            candidate. Contracts created by factories are caught only when
            they emit a log (no trace_* on the free tier). discover_candidates
            keeps its signature, its result and its order; the keys of
            candidate_origins are exactly the elements of discover_candidates
            for the same receipts, under the same tolerance (non-dict
            elements, None, missing keys and missing logs skipped). An
            address that is both a contractAddress and a log emitter (or a
            to) in the same block is "created": contractAddress wins. A
            contract made by a factory inside a transaction is not a
            contractAddress of any receipt, so it is "seen" even in the
            block that made it -- "created" means a deploy transaction of
            that block, nothing more. An empty list gives {}.
          guardrails: [Deterministic Output, Tolerant Parser]
          steps:
            - reads: RPC Response
          examples:
            - given: 'the "result" list of tests/fixtures/receipts_26077729.json (218 receipts, 626 logs)'
              when: 'discover_candidates is called'
              then: '206 addresses; 135 distinct to, 119 distinct log addresses, one contractAddress 0xb53c071bdb35d21aa1216b084f79c372d71053d5'
              ref: 'jq count over the fixture'
            - given: 'an empty list'
              when: 'discover_candidates is called'
              then: '[]'
            - given: 'the "result" list of tests/fixtures/receipts_26077729.json'
              when: 'candidate_origins is called'
              then: >
                a dict of 206 entries whose sorted keys equal
                discover_candidates of the same list; exactly one value is
                "created", for 0xb53c071bdb35d21aa1216b084f79c372d71053d5 (the
                contractAddress of receipt 207, which also emits a log in the
                block), and the other 205 are "seen"
              ref: 'phase 13; counted over the fixture'
            - given: >
                the list [None, "x", {"to": None, "contractAddress": None},
                {"to": "0x1807090DD15A6F58E00FD769E32EBF20EE610385", "logs": None},
                {"to": None, "contractAddress": "0xB53C071BDB35D21AA1216B084F79C372D71053D5",
                "logs": [{"address": "0xb53c071bdb35d21aa1216b084f79c372d71053d5"}, "y",
                {"address": None}]}], and then []
              when: 'candidate_origins is called'
              then: >
                {"0x1807090dd15a6f58e00fd769e32ebf20ee610385": "seen",
                "0xb53c071bdb35d21aa1216b084f79c372d71053d5": "created"}, no
                exception; and {} for []
              ref: 'Tolerant Parser; contractAddress wins over a log of the same address'
        - name: Ingest Block
          description: >
            ingest_block(block, receipts, get_code, store, max_calls=None,
            watch=None, on_alerts=None, workers=None, get_storage=None,
            on_upgrades=None) -> stats dict {candidates, known,
            fetched, contracts, eoas, failed, deferred, complete, alerts,
            upgrades}.
            get_code(address, block) -> hex string is injected. watch is the
            min_score passed to match_watchlist; None means 0.8. on_alerts is
            an optional sink for the alerts of this block, called before the
            call returns or raises. Phase 14: get_storage(address, slot,
            block) -> hex word is injected too (None: no slot is read);
            on_upgrades is the sink for the block's upgrade records, with
            the same once-per-call rule as on_alerts. The module holds the
            constants IMPL_SLOT
            ("0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc")
            and BEACON_SLOT
            ("0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50"),
            slot_address(word) -> str or None, and
            fetch_implementation(store, address, block, get_storage,
            get_code) -> str or None, the one place a slot is read.
          behavior: >
            Candidates already in the store are skipped (known). Each other
            one costs one get_code call until max_calls is reached; the rest
            are deferred. complete = (deferred == 0). "0x" stores the address
            with code_id None (eoas); other code goes through put_code. A
            get_code that raises, or returns text that is not 0x-hex, counts
            as failed: the address is not stored, and it neither stops nor
            holds the block. Invariants of the stats: candidates = known +
            fetched + deferred and fetched = contracts + eoas + failed. Every
            newly stored address with code (not only a new code_id) is
            checked by match_watchlist; each alert is extended with the key
            address, so alerts is a list of {address, seed_address, label,
            score} ordered by address; alerts are returned, not printed.
            on_alerts, when given, is called exactly once per ingest_block
            call with that list, and it is called even when get_code raises
            KeyboardInterrupt: the alerts found before the interruption are
            handed over, sorted by address, before the exception leaves. An
            alert reaches on_alerts exactly once, so a caller that prints
            from on_alerts must not print the returned list as well.
            workers (phase 10): None or 1 is the sequential loop above, one
            get_code at a time. With workers K > 1 the get_code calls of the
            block -- the same candidates, the first max_calls unknown ones in
            sorted order -- run in at most K threads at once
            (concurrent.futures.ThreadPoolExecutor, standard library); only
            get_code runs in a worker thread. Everything else -- has_address,
            put_code, put_address, match_watchlist, the stats and the alerts
            -- happens in the calling thread, taking the results in candidate
            order, so for the same get_code answers the stats, the alerts,
            their order and the stored rows are exactly those of the
            sequential run. (The store is a sqlite3 connection, usable only
            from the thread that opened it.) A get_code that raises an
            Exception in a worker counts as failed, as before. A
            KeyboardInterrupt -- raised by a get_code or while the calling
            thread waits -- stops the block the same way as in the sequential
            loop: the results of the candidates before it in order are stored,
            on_alerts gets their alerts once, the calls not yet started are
            cancelled and the exception propagates. Known limitation, accepted
            2026-09-30: calls already in flight are not interrupted, so the
            process may wait for up to K of them (typically 0.3 s each, at
            most the transport timeout of 30 s) before it exits.
            Origin (phase 13): ingest_block computes
            candidate_origins(receipts) once per call and stores every
            address it stores -- contracts and eoas alike, in the sequential
            and the workers path -- with put_address(address, code_id or
            None, block, origin=<its origin>), origin "created" or "seen".
            Every alert gains the key origin, the origin of its address, so
            alerts is a list of {address, seed_address, label, score,
            origin}; the same dicts reach on_alerts. The stats, their
            invariants, the alert order and which addresses are stored do
            not change; match_watchlist itself is unchanged (its alerts
            have no address and no origin).
            Standard proxies (phase 14). slot_address(word) is pure: for a
            str word of "0x" plus 64 hex digits whose first 24 digits are
            zero and whose last 40 are not all zero it returns "0x" plus
            those 40 digits lowercased; anything else (None, a non-string,
            the zero word, a short or malformed string) gives None.
            fetch_implementation(store, address, block, get_storage,
            get_code) reads get_storage(address, IMPL_SLOT, block); when
            slot_address of the answer is None and the call did not raise,
            it reads get_storage(address, BEACON_SLOT, block); the first
            address found is written with store.set_implementation and
            returned; when it came from IMPL_SLOT and store.has_address of
            it is False, its code is fetched with get_code(implementation,
            block) and stored exactly as _store_text stores a candidate --
            "0x" as an address without code, hex as put_code/put_address --
            with origin "impl"; a beacon address is stored in the column
            and never fetched (calling the beacon is out of scope). A
            get_storage or get_code that raises, or answers something
            slot_address rejects, ends the attempt there: the stored
            implementation is left as it was (never cleared), nothing else
            is stored, None is returned when no address was found, and no
            exception leaves (Tolerant Parser). get_storage None means no
            read at all: None is returned and the store is untouched.
            ingest_block uses it in two more steps after the candidate loop,
            both skipped when get_storage is None: step 2, in candidate
            order, for every candidate this call stored with a standard
            proxy code (fingerprint std_proxy True) and for every known
            candidate present in store.implementations() (read once per
            call, before the loop), it calls fetch_implementation; for a
            known candidate whose stored implementation was not None and
            whose newly read one is not None and differs, it appends
            {"address", "old", "new", "block"} to stats["upgrades"] (a known
            proxy with NULL implementation that resolves now is stored
            silently: no record); step 3, alerts: every candidate stored in
            this call whose implementation's code is stored (after step 2,
            fetched now or already there) is checked by match_watchlist with
            the implementation's bytes, each alert gaining address = the
            proxy's address and origin = the proxy's origin ("created" or
            "seen"); every implementation stored in this call is checked
            with its own bytes, its alerts gaining address = the
            implementation address and origin "impl". A proxy whose
            implementation was not resolved, or whose implementation's code
            is not stored, gets the phase-9 check of its own bytes (0.0
            against everything). Neither step changes candidates, known,
            fetched, contracts, eoas, failed, deferred or complete: the slot
            reads and implementation fetches are outside max_calls and are
            not counted in the stats; upgrades is the list of step 2 in
            candidate order; alerts stays sorted by address. on_upgrades,
            when given, is called exactly once per call with stats["upgrades"]
            (possibly []), after on_alerts, on the normal return and on the
            KeyboardInterrupt path alike, with what was found so far. Under
            workers K > 1 the get_storage and get_code calls of steps 2 and
            3 may run in the pool like the candidate get_code calls; every
            store write and every match stays in the calling thread, in
            candidate order, so for the same answers the stats, the alerts,
            the upgrades and the stored rows equal those of the sequential
            run. The stats dict has exactly the ten keys above.
