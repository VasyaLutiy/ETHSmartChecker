              then: '"/" is 200 with content_type "text/html; charset=utf-8" and a body containing "/api/health", "/api/events", "/api/summary" and "/api/clusters"; "/assets/app.js" is 404 with a JSON {"error"} body'
              ref: 'phase 15: the backend runs before the frontend exists'
            - given: >
                a temp directory P holding secret.txt ("top secret") and the
