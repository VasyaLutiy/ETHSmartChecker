version: 1
System:
  name: ethsc
  description: >
    ETHSmartChecker proof: indexes the runtime bytecode of Ethereum mainnet
    contracts seen in new blocks (Infura free tier, HTTPS polling), stores it
    in SQLite by content hash, and clusters it by code on three levels (L0
    identical code, L1 identical skeleton or proxy target, L2 selector or
    opcode similarity). Security aim: from one known scam or vulnerable
    contract, find its copies and near-copies, and alert when a new one
    appears. Package ethsc/, CLI python -m ethsc.
  requirements: [Stdlib Only, Offline Tests, Real Fixtures]
  guardrails: [Deterministic Output]
  groups:
    - name: evm
      description: >
        Pure bytecode analysis over runtime code given as bytes: disassembly,
        compiler-metadata stripping, dispatcher selectors, proxy detection,
        and the masked skeleton used for L1 clustering. No I/O.
      functions:
        - name: Disassemble
          description: >
            disassemble(code: bytes) -> list of (pc, op, arg) tuples, one per
            instruction, in code order: pc is the byte offset, op the opcode
            byte (int), arg the immediate bytes of PUSH1..PUSH32 (0x60..0x7f,
            n = op - 0x5f bytes) and b"" for every other opcode.
          behavior: >
            Every byte that is not a PUSH immediate is an instruction, including
            undefined opcodes (no name table, no validation). A PUSH whose
            immediate runs past the end of the code takes the bytes that are
            there (a shorter arg) and ends the list; nothing raises. Empty code
            gives []. PUSH0 (0x5f) has no immediate.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - produces: Instruction
          examples:
            - given: 'the bytes of tests/fixtures/code_weth9.hex (0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2, 3124 bytes)'
              when: 'disassemble is called'
              then: 'the first three instructions are (0, 0x60, b"\x60"), (2, 0x60, b"\x40"), (4, 0x52, b"")'
              ref: 'fixture bytes 0x6060604052; WETH9 is solc 0.4.19 (Sourcify)'
            - given: 'the 3081-byte body of code_weth9.hex (the code without its last 43 bytes)'
              when: 'disassemble is called'
              then: 'the list has 1555 instructions'
              ref: 'counted over the fixture'
            - given: 'the 4 bytes 0x600161ff (PUSH1 0x01, then PUSH2 with only one byte left)'
              when: 'disassemble is called'
              then: '[(0, 0x60, b"\x01"), (2, 0x61, b"\xff")] and no exception'
              ref: 'Tolerant Parser'
            - given: 'empty code b""'
              when: 'disassemble is called'
              then: 'the result is []'
              ref: 'Tolerant Parser'
        - name: Strip Metadata
          description: >
            strip_metadata(code: bytes) -> (body, trailer): splits off the
            solc CBOR metadata appended at the end of runtime code.
          behavior: >
            Let n be the big-endian value of the last 2 bytes. When
            len(code) >= 2, 0 < n <= len(code) - 2 and the byte at
            len(code) - 2 - n is a CBOR map header 0xa1..0xa5, the trailer is
            the last n + 2 bytes and the body is everything before it.
            Otherwise body is the whole code and trailer is b"". No CBOR
            decoding. Never raises.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
          examples:
            - given: 'code_weth9.hex (3124 bytes, ends 0x0029)'
              when: 'strip_metadata is called'
              then: 'body is 3081 bytes; trailer is 43 bytes and starts with a165627a7a72305820 (bzzr0)'
              ref: 'fixture bytes'
            - given: 'code_univ2_usdc_weth.hex (0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc, 11293 bytes, solc 0.5.16)'
              when: 'strip_metadata is called'
              then: 'body is 11241 bytes; trailer is 52 bytes, starts with a265627a7a72315820 and contains 64736f6c6343000510 (solc 0.5.16)'
              ref: 'fixture bytes; compiler version from Sourcify'
            - given: 'code_univ3_usdc_weth_005.hex (0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640, 22142 bytes, solc 0.7.6, bytecodeHash none)'
              when: 'strip_metadata is called'
              then: 'body is 22130 bytes and trailer is exactly a164736f6c6343000706000a (12 bytes)'
              ref: 'fixture bytes'
            - given: 'the 45-byte EIP-1167 clone code_clone_270df012.hex (last 2 bytes 0x5bf3) and empty code b""'
              when: 'strip_metadata is called on each'
              then: 'the clone comes back whole with trailer b""; empty code gives (b"", b"")'
              ref: 'Tolerant Parser'
        - name: Extract Selectors
          description: >
            extract_selectors(code: bytes) -> sorted list of distinct 4-byte
            function selectors of the dispatcher, each as "0x" + 8 lowercase
            hex digits.
          behavior: >
            Disassemble the body from strip_metadata. A selector is the arg of
            a PUSH4 (0x63) instruction with a 4-byte arg when one of the next
            two instructions is EQ (0x14); this covers both the
            DUP1 PUSH4 s EQ and the PUSH4 s DUP2 EQ dispatcher shapes and
            skips the PUSH4 used by GT/LT binary-search splits and by masks.
            Code with no dispatcher gives [].
          guardrails: [Tolerant Parser]
          steps:
            - calls: Disassemble
            - calls: Strip Metadata
          examples:
            - given: 'code_weth9.hex'
              when: 'extract_selectors is called'
              then: >
                exactly the 11 published WETH9 selectors: 0x06fdde03,
                0x095ea7b3, 0x18160ddd, 0x23b872dd, 0x2e1a7d4d, 0x313ce567,
                0x70a08231, 0x95d89b41, 0xa9059cbb, 0xd0e30db0, 0xdd62ed3e
              ref: 'WETH9 ABI (Sourcify exact match, tests/fixtures/abi_weth9.sourcify.json, 11 functions)'
            - given: 'code_usdt.hex (0xdAC17F958D2ee523a2206206994597C13D831ec7)'
              when: 'extract_selectors is called'
              then: >
                exactly 32 selectors: 0x06fdde03, 0x0753c30c, 0x095ea7b3,
                0x0e136b19, 0x0ecb93c0, 0x18160ddd, 0x23b872dd, 0x26976e3f,
                0x27e235e3, 0x313ce567, 0x35390714, 0x3eaaf86b, 0x3f4ba83a,
                0x59bf1abe, 0x5c658165, 0x5c975abb, 0x70a08231, 0x8456cb59,
                0x893d20e8, 0x8da5cb5b, 0x95d89b41, 0xa9059cbb, 0xc0324c77,
                0xcc872b66, 0xdb006a75, 0xdd62ed3e, 0xdd644f72, 0xe47d6060,
                0xe4997dc5, 0xe5b5019a, 0xf2fde38b, 0xf3bdc228
              ref: 'TetherToken ABI (Sourcify match, tests/fixtures/abi_usdt.sourcify.json, 32 functions)'
            - given: 'code_univ2_usdc_weth.hex (solc 0.5.16, dispatcher with GT splits)'
              when: 'extract_selectors is called'
              then: '27 selectors, including 0x022c0d9f (swap) and 0x0902f1ac (getReserves)'
              ref: 'UniswapV2Pair ABI (Sourcify match, tests/fixtures/abi_univ2_pair.sourcify.json, 27 functions)'
            - given: 'code_belle.hex (the BELLE honeypot token)'
              when: 'extract_selectors is called'
              then: '14 selectors, including 0xf7e58a63 (Blacklist(address,bool)) and 0x78051f4d (RenounceOwnership(address))'
              ref: 'BELLE ABI (Sourcify exact match, tests/fixtures/abi_belle.sourcify.json, 14 functions)'
            - given: 'the EIP-1167 clone code_clone_270df012.hex, then empty code b""'
              when: 'extract_selectors is called on each'
              then: 'both give []'
              ref: 'Tolerant Parser'
        - name: Detect Proxy
          description: >
            detect_proxy(code: bytes) -> {"kind": "eip1167" | "eip7702",
            "target": "0x" + 40 lowercase hex} or None: recognizes the exact
            EIP-1167 minimal proxy runtime and the EIP-7702 delegation
            designator, and returns the implementation (or delegate) address.
          behavior: >
            eip1167: exactly 45 bytes, 363d3d373d3d3d363d73 + 20 address bytes
            + 5af43d82803e903d91602b57fd5bf3. eip7702: exactly 23 bytes,
            ef0100 + 20 address bytes. Anything else, including a truncated
            clone and the shortened vanity-address variants of EIP-1167,
            gives None.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - produces: Proxy Info
          examples:
            - given: 'code_clone_270df012.hex and code_clone_3b2fac8e.hex (two clones seen in block 26077729)'
              when: 'detect_proxy is called on each'
              then: 'both give {"kind": "eip1167", "target": "0x4181f37093e3a21a4e0d5ef355c5b1938cba5bfb"}'
              ref: 'target read from the clone bytes 10..30; the target is HolderDistributor, Sourcify exact match'
            - given: 'code_clone_2ca7b61b.hex'
              when: 'detect_proxy is called'
              then: 'target is "0x8b72b9b8e544f944cdcdf0cdb6194f917ac1eba5" (kind eip1167), a different implementation'
              ref: 'clone bytes; target is LaunchToken, Sourcify exact match'
            - given: 'code_7702_04cfab85.hex (23 bytes, the code of the delegated EOA 0x04cfab854b82159745eead5ed4ad148645e1173b)'
              when: 'detect_proxy is called'
              then: '{"kind": "eip7702", "target": "0x0000fb7702036ff9f76044a501ac1aa74cbab16b"}'
              ref: 'fixture bytes ef0100 + target; EIP-7702 designator format'
            - given: 'the first 44 bytes of code_clone_270df012.hex, code_weth9.hex, and empty code b""'
              when: 'detect_proxy is called on each'
              then: 'all three give None'
              ref: 'Tolerant Parser'
        - name: Build Skeleton
          description: >
            build_skeleton(code: bytes) -> bytes: the body from strip_metadata
            re-serialized instruction by instruction with the immediates of
            PUSH20 (0x73) and PUSH32 (0x7f) replaced by zero bytes of the same
            length; every other byte kept.
          behavior: >
            Masks what differs between deployments of one source: constructor
            immutables (always PUSH32 in solc) and hardcoded addresses
            (PUSH20). The length equals the body length. A truncated PUSH20 or
            PUSH32 masks only the bytes present. Same compiler output with a
            different metadata trailer gives the same skeleton.
          guardrails: [Tolerant Parser]
          steps:
            - calls: Disassemble
            - calls: Strip Metadata
          examples:
            - given: >
                code_univ3_usdc_weth_005.hex (0x88e6A0c2...) and
                code_univ3_pool_e0554a47.hex (0xe0554a476a092703abdb3ef35c80e0d76d32939f),
                two UniswapV3Pool deployments (Sourcify match) of 22142 bytes each
              when: 'build_skeleton is called on each'
              then: 'the raw codes differ in 74 bytes, all inside PUSH32 immediates, and the two skeletons are equal'
              ref: 'byte diff of the two fixtures'
            - given: >
                code_launchtoken_4e67db19.hex and code_launchtoken_40676634.hex,
                two LaunchToken deployments (Sourcify exact match for 0x4e67db19...) of 2383 bytes each
              when: 'build_skeleton is called on each'
              then: 'the raw codes differ in 58 bytes inside 3 PUSH32 immediates, and the two skeletons are equal'
              ref: 'byte diff of the two fixtures'
            - given: 'code_weth9.hex, and a copy of it with one byte of the metadata trailer flipped (byte -5 xor 0xff)'
              when: 'build_skeleton is called on each'
              then: 'both skeletons are equal and each is 3081 bytes long'
              ref: 'fixture bytes'
            - given: 'code_weth9.hex and code_usdt.hex'
              when: 'build_skeleton is called on each'
              then: 'the skeletons differ'
        - name: Flag Risk
          description: >
            risk_flags(code: bytes) -> {"selfdestruct": bool,
            "mutable_delegatecall": bool}: two per-code security flags read
            from the runtime bytecode alone -- no source, no data-flow, no
            control-flow graph.
          behavior: >
            Both flags are read from the disassembly of the body from
            strip_metadata, so a 0xFF or 0xF4 byte inside a PUSH immediate or
            inside the metadata trailer never counts. selfdestruct is True when
            an opcode SELFDESTRUCT (0xFF) appears in that body: it marks the
            opcode present as an executable instruction, not a proof that some
            path reaches it (there is no CFG here, only disassembly).
            mutable_delegatecall is True when three conditions hold together:
            an opcode DELEGATECALL (0xF4) appears in the body, detect_proxy(code)
            is not "eip1167" (an EIP-1167 clone bakes its implementation address
            into the code and is excluded, however it is reached), and an opcode
            SLOAD (0x54) appears in the body -- the cheap syntactic stand-in,
            since data-flow is out of scope, for an implementation address that
            comes from storage rather than hardcoded. Order and position of the
            opcodes do not matter, only their presence. Never raises on empty or
            garbage bytes: risk_flags(b"") is both False.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - calls: Disassemble
            - calls: Strip Metadata
            - calls: Detect Proxy
            - produces: Risk Flags
          examples:
            - given: 'code_weth9.hex'
              when: 'risk_flags is called'
              then: 'both flags are False'
              ref: 'no SELFDESTRUCT and no DELEGATECALL opcode in the WETH9 body'
            - given: 'the EIP-1167 clone code_clone_270df012.hex (one DELEGATECALL, target baked as a PUSH20 immediate)'
              when: 'risk_flags is called'
              then: 'both flags are False -- an eip1167 clone is never mutable_delegatecall'
              ref: 'detect_proxy is eip1167; Detect Proxy example 1'
            - given: 'the single byte b"\xff", then the two bytes b"\x60\xff" (PUSH1 0xff)'
              when: 'risk_flags is called on each'
              then: 'selfdestruct is True for b"\xff" and False for b"\x60\xff"; both mutable_delegatecall False'
              ref: 'Tolerant Parser: 0xff as an opcode versus 0xff as PUSH data'
            - given: 'a store filled from codes_26077729.json, risk_flags read over every distinct code'
              when: 'the codes with each flag are counted'
              then: >
                exactly 1 code has selfdestruct (address
                0xfeeeeee44046c3f61a8cc081e0918ef0de0a7ffc) and 29 codes have
                mutable_delegatecall (over 33 addresses); no code has both
              ref: 'counted over codes_26077729.json, 2026-09-30'
            - given: 'empty code b""'
              when: 'risk_flags is called'
              then: 'both flags are False and nothing raises'
              ref: 'Tolerant Parser'
      dataObjects:
        - name: Runtime Code
          description: >
            Deployed runtime bytecode as bytes, decoded from the hex string of
            eth_getCode ("0x" + hex). Fixtures tests/fixtures/code_*.hex hold
            that string verbatim, no trailing newline; decode with
            bytes.fromhex(text.strip()[2:]). "0x" is an account with no code.
          schema: bytes
        - name: Instruction
          description: One disassembled instruction.
          schema:
            pc: int, byte offset in the code
            op: int, opcode byte 0..255
            arg: bytes, PUSH immediate (possibly short at the end), else b""
        - name: Proxy Info
          description: What a proxy or delegation points to.
          schema:
            kind: '"eip1167" or "eip7702"'
            target: '"0x" + 40 lowercase hex'
        - name: Risk Flags
          description: >
            The two per-code security flags risk_flags reads from bytecode,
            in this fixed key order.
          schema:
            selfdestruct: 'bool -- a SELFDESTRUCT (0xFF) opcode in the stripped body'
            mutable_delegatecall: 'bool -- a DELEGATECALL (0xF4) opcode in a non-eip1167 code whose body also has SLOAD (0x54)'
    - name: fingerprint
      description: >
        One fingerprint per distinct code, and the L2 similarity between two
        codes. Pure functions over bytes; calls evm.
      functions:
        - name: Fingerprint Code
          description: >
            fingerprint(code: bytes) -> Fingerprint dict or None for empty
            code: code_id (sha256 hex of the raw code), size, skeleton_hash
            (sha256 hex of build_skeleton), selectors (extract_selectors),
            proxy (detect_proxy).
          behavior: >
            code_id is sha256, not keccak: stdlib has no keccak and the
            clustering does not need the chain's codeHash. Never raises on
            garbage bytes.
          guardrails: [Tolerant Parser]
          steps:
            - uses: evm
            - produces: Fingerprint
          examples:
            - given: 'code_univ2_usdc_weth.hex and code_univ2_weth_usdt.hex (0x0d4a11d5EEaaC28EC3F61d100daF4d40471f1852)'
              when: 'fingerprint is called on each'
              then: 'both code_id are 8b5db55fa9ab3b9527508d4abe0b39eb588bf310270c8e04b3f38214e8ba63b4, size 11293, 27 selectors'
              ref: 'the two fixtures are byte-identical (cmp); sha256sum of the decoded bytes'
            - given: 'code_weth9.hex'
              when: 'fingerprint is called'
              then: 'code_id is 5566bf50796faf93c9b6f6adacd3b32c70bfe16b48ffc59db6cd144cbdc89739, size 3124, proxy None'
              ref: 'sha256 of the decoded fixture bytes'
            - given: 'code_univ3_usdc_weth_005.hex and code_univ3_pool_e0554a47.hex'
              when: 'fingerprint is called on each'
              then: 'code_id differ, skeleton_hash are equal'
              ref: 'Build Skeleton example 1'
            - given: 'empty code b""'
              when: 'fingerprint is called'
              then: 'the result is None'
              ref: 'Tolerant Parser'
        - name: Similarity Score
          description: >
            similarity(code_a: bytes, code_b: bytes) -> float in [0, 1]: the
            Jaccard index of the selector sets when both are non-empty,
            otherwise the Jaccard index of the sets of opcode 3-grams (op
            bytes only, args dropped) of the two stripped bodies.
          behavior: >
            Jaccard = |A & B| / |A | B|, and 0.0 when both sets are empty:
            similarity(b"", b"") == 0.0, no exception on empty or garbage
            bytes. Symmetric. Identical code gives 1.0. The score is the float
            of the division, never rounded: 13/15, 26/32, 9/16 compare exactly
            downstream.
          steps:
            - uses: evm
          examples:
            - given: 'code_weth9.hex (11 selectors) and code_usdt.hex (32 selectors)'
              when: 'similarity is called'
              then: '9/34 (0.2647 to 4 places); the 9 shared are the ERC-20 core name..allowance'
              ref: 'selector lists above, hand count'
            - given: 'code_univ2_usdc_weth.hex (27) and code_weth9.hex (11)'
              when: 'similarity is called'
              then: '9/29 (0.3103 to 4 places)'
              ref: 'hand count'
            - given: 'code_belle.hex and code_belle_copy_1807090d.hex (ALPHA, same deployer, Sourcify exact match)'
              when: 'similarity is called'
              then: '13/15 (0.8667 to 4 places); the copy has 0x8f5db675 BotBlacklist(address,bool) instead of 0xf7e58a63 Blacklist(address,bool)'
              ref: 'selector diff of the fixtures; keccak of the two signatures'
            - given: 'code_clone_270df012.hex and code_clone_2ca7b61b.hex (no selectors, different targets)'
              when: 'similarity is called'
              then: '1.0 (the same 22 opcode 3-grams)'
              ref: 'hand count over the 45-byte clone'
      dataObjects:
        - name: Fingerprint
          description: The analysed identity of one distinct code.
          schema:
            code_id: sha256 hex of the raw code (64 chars)
            size: int, bytes
            skeleton_hash: sha256 hex of build_skeleton(code)
            selectors: sorted list of "0x…" 8-hex strings
            proxy: Proxy Info or None
    - name: store
      description: >
        SQLite persistence: distinct codes with their fingerprints, addresses
        pointing at codes, the follow progress, the security watchlist, and
        the daily credit ledger. One file, stdlib sqlite3.
      functions:
        - name: Store Codes And Contracts
          description: >
            Store(path) opens or creates the database (CREATE TABLE IF NOT
            EXISTS). put_code(code) -> code_id stores the code and its
            Fingerprint once per code_id; put_address(address, code_id, block)
            records an address (code_id None for an account without code);
            has_address(address) -> bool; code_of(address) -> bytes or None;
            addresses_of(code_id) -> sorted list. Bulk reads for cluster:
            fingerprints() -> list of Fingerprint dicts, one per row of codes,
            sorted by code_id; code_by_id(code_id) -> bytes or None for an
            unknown code_id. close() closes the connection.
          behavior: >
            Addresses are lowercased on the way in: every method accepts an
            address in any case and stores or looks it up lowercase. Every
            write is committed before the method returns. put_code on a known
            code_id and put_address on a known address change nothing and do
            not raise. Every list the store returns is sorted. Each element of
            fingerprints() equals fingerprint(code) of that code, with exactly
            the keys code_id, size, skeleton_hash, selectors (a list, from
            json.loads of the stored text) and proxy ({kind, target} or None
            when proxy_kind is NULL); an empty database gives []. Other
            modules read the store only through these methods, never through
            its SQLite connection.
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - uses: fingerprint
            - modifies: Code Database
          examples:
            - given: >
                a fresh temp db and the four addresses of block 26077729 whose
                code in tests/fixtures/codes_26077729.json has code_id 8b5db55f…
                (0x22052a1a…, 0x2621cc0b…, 0x3041cbd3…, 0xb4e16d01…, all UniswapV2Pair)
              when: 'put_code and put_address are called for each'
              then: 'the codes table has 1 row, the addresses table 4 rows, addresses_of returns the 4 addresses sorted'
              ref: 'counted over codes_26077729.json'
            - given: 'an address stored with code_id None (an EOA, eth_getCode "0x")'
              when: 'has_address and code_of are called'
              then: 'has_address is True and code_of is None'
            - given: 'the db file closed and reopened'
              when: 'addresses_of is called'
              then: 'the same 4 addresses come back'
            - given: 'a fresh temp db, then code_weth9.hex, code_clone_270df012.hex and code_belle.hex put in that order'
              when: 'fingerprints() is called before and after, then code_by_id for each code_id and for an unknown id'
              then: '[] before; after, the three fingerprint(code) dicts sorted by code_id; code_by_id gives back the exact bytes, and None for the unknown id'
              ref: 'store-read acceptance of phase 3'
            - given: 'a store filled from codes_26077729.json'
              when: 'fingerprints() is called'
              then: '130 fingerprints, 12 of them with proxy not None'
              ref: 'counted over codes_26077729.json (store-read acceptance of phase 3)'
        - name: Track Progress
          description: >
            get_progress() -> int or None, the last fully ingested block;
            set_progress(block) stores it.
          steps:
            - modifies: Code Database
          examples:
            - given: 'a fresh temp db'
              when: 'get_progress is called, then set_progress(26077729) and get_progress, then the db is reopened'
              then: 'None, then 26077729, and 26077729 after the reopen'
        - name: Manage Watchlist
          description: >
            add_seed(address, label) marks the stored code of address as a
            known-bad seed; seeds() -> list of {address, label, code_id}
            sorted by address.
          behavior: >
            add_seed on an address with no stored code raises
            KeyError(address): both an address the db does not know and a
            known address stored with code_id None (an EOA). The address may
            come in any case. Adding the same address twice keeps one seed
            with the latest label.
          steps:
            - modifies: Code Database
          examples:
            - given: >
                a db holding code_belle.hex at 0x34c6211621f2763c60eb007dc2ae91090a2d22f6
                (Etherscan: "This token is reported to be a honeypot token")
              when: 'add_seed(address, "BELLE honeypot") is called twice'
              then: 'seeds() has exactly 1 entry, label "BELLE honeypot", code_id = fingerprint(code_belle).code_id'
              ref: 'Etherscan warning on the address, checked 2026-09-28'
            - given: 'an address that is not in the db'
              when: 'add_seed is called'
              then: 'KeyError'
        - name: Budget Ledger
          description: >
            spend(day, method, credits) adds credits to the ledger of a UTC
            day ("YYYY-MM-DD"); spent(day) -> int is the day's total.
          steps:
            - modifies: Code Database
          examples:
            - given: 'a fresh db'
              when: 'spend("2026-09-28", "eth_getBlockReceipts", 1000) once and spend("2026-09-28", "eth_getCode", 80) 206 times'
              then: 'spent("2026-09-28") is 17480 and spent("2026-09-29") is 0'
              ref: '206 candidates of block 26077729; prices 1000 and 80 from Infura''s credit table'
        - name: Base Counts
          description: >
            The read-only aggregates a report needs and no other reader
            gives. counts() -> dict with exactly the keys addresses,
            addresses_with_code, addresses_without_code, codes, blocks;
            ledger_days() -> list of {day, credits} over the whole ledger,
            sorted by day ascending.
          behavior: >
            counts()["blocks"] is the number of distinct block values in the
            addresses table, not their span. addresses_without_code counts
            the rows whose code_id is NULL (accounts whose eth_getCode was
            "0x"), and addresses equals addresses_with_code plus
            addresses_without_code. codes is the number of rows of the codes
            table, the same length as fingerprints(). ledger_days() sums the
            credits of every method of one day into one int per day and
            gives [] on an empty ledger. On an empty database counts()
            gives 0 under all five keys. Both are pure reads: they write
            nothing and commit nothing, and every value they return is an
            int.
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - reads: Code Database
          examples:
            - given: 'a store filled from codes_26077729.json (206 addresses of block 26077729, 59 of them without code)'
              when: 'counts() is called'
              then: 'addresses 206, addresses_with_code 147, addresses_without_code 59, codes 130, blocks 1'
              ref: 'counted over codes_26077729.json'
            - given: 'a fresh db, then spend("2026-09-28", "eth_getBlockReceipts", 1000) and spend("2026-09-28", "eth_getCode", 80) twice, then spend("2026-09-27", "eth_blockNumber", 80)'
              when: 'ledger_days() is called on the fresh db and after the spends'
              then: '[] first; then [{"day": "2026-09-27", "credits": 80}, {"day": "2026-09-28", "credits": 1160}]'
            - given: 'an empty database'
              when: 'counts() is called'
              then: 'all five keys are 0'
      dataObjects:
        - name: Code Database
          description: One SQLite file.
          schema: >
            codes(code_id TEXT PRIMARY KEY, size INTEGER, skeleton_hash TEXT,
            selectors TEXT (JSON list), proxy_kind TEXT, proxy_target TEXT,
            code BLOB); addresses(address TEXT PRIMARY KEY, code_id TEXT NULL,
            block INTEGER); progress(key TEXT PRIMARY KEY, block INTEGER);
            seeds(address TEXT PRIMARY KEY, code_id TEXT, label TEXT);
            ledger(day TEXT, method TEXT, credits INTEGER)
    - name: cluster
      description: >
        Clusters and similarity search over the store: L0 identical code, L1
        identical skeleton, proxy by target, L2 similarity by full scan, and
        the watchlist check for a new code.
      functions:
        - name: Build Clusters
          description: >
            build_clusters(store) -> list of Cluster: L0 per code_id with >= 2
            addresses; L1 per skeleton_hash with >= 2 distinct code_id; proxy
            per (kind, target) with >= 2 addresses. Proxy codes (eip1167,
            eip7702) enter only proxy clusters.
          behavior: >
            Cluster = {level: "L0" | "L1" | "proxy", key, members: sorted
            lowercase addresses}; key is the code_id, the skeleton_hash, or
            "<kind>:<target>". L0 and L1 are built from non-proxy codes only;
            a proxy code never enters L0 or L1, however many addresses it
            has. L1 members are the addresses of all the codes sharing the
            skeleton_hash; a proxy cluster counts the addresses of every code
            with that (kind, target) pair. Addresses without code are never
            members. The list is sorted by member count descending, then
            level (L0, L1, proxy), then key; insertion order does not matter.
            Reads the store through fingerprints(), code_by_id() and
            addresses_of() only.
          guardrails: [Deterministic Output]
          steps:
            - uses: store
            - produces: Cluster
          examples:
            - given: 'a store filled from codes_26077729.json (206 candidates: 59 without code, 147 with code, 130 distinct code_id)'
              when: 'build_clusters is called'
              then: >
                7 L0 clusters (sizes 4, 2, 2, 2, 2, 2, 2), 2 L1 clusters (8
                UniswapV3Pool deployments, 5 LaunchToken deployments) and 6
                proxy clusters (eip1167 0x4181f370… with 3, eip1167 0x8b72b9b8…
                with 2, eip7702 0xd2e28229… with 3, and three eip7702 with 2)
              ref: 'counted over codes_26077729.json'
            - given: 'the same store'
              when: 'build_clusters is called'
              then: 'the first cluster is L1 with 8 members including 0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640; the first L0 cluster has key 8b5db55f… and 4 members'
            - given: 'the same codes inserted in reverse order'
              when: 'build_clusters is called'
              then: 'the result is equal'
              ref: 'Deterministic Output'
        - name: Find Similar
          description: >
            find_similar(store, address, min_score=0.8) -> list of (address,
            score) for every other stored address with code whose similarity
            to address's code is >= min_score; sorted by score descending,
            then address.
          behavior: >
            Full scan: one similarity per distinct code_id, fanned out to its
            addresses. Returns tuples (address, score) with score the float
            from similarity, unrounded. The queried address itself is
            excluded; the other addresses of the same code come back with
            1.0. The query address may be in any case. Unknown address or one
            without code gives [].
          guardrails: [Deterministic Output]
          steps:
            - uses: fingerprint
            - uses: store
          examples:
            - given: 'the store from codes_26077729.json'
              when: 'find_similar(store, "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc")'
              then: >
                0x22052a1a0f5a3d2839d71c458f177e68b0e73963,
                0x2621cc0b3f3c079c1db0e80794aa24976f0b9e3c,
                0x3041cbd36888becc7bbcbc0045e3b1f144466f5f with 1.0, then
                0xcf6daab95c476106eca715d48de4b13287ffdeaa with 26/32 (0.8125)
              ref: '0xcf6daab9… is a UniswapV2Pair built with solc 0.6.12 (Sourcify match); selector diff counted'
            - given: 'a store with code_belle.hex and its four copies code_belle_copy_*.hex at their addresses'
              when: 'find_similar(store, "0x34c6211621f2763c60eb007dc2ae91090a2d22f6")'
              then: 'the 4 copies, each 13/15, in address order 0x1807…, 0x2141…, 0x46ca…, 0x6411…'
              ref: 'deployer 0xf80f6fa4… nonces 0, 1, 5, 13 (CREATE addresses); selector diff'
        - name: Match Watchlist
          description: >
            match_watchlist(store, code, min_score=0.8) -> list of Alert
            {seed_address, label, score} for every seed whose code has
            similarity >= min_score with code; sorted by score descending,
            then seed_address.
          behavior: >
            One similarity per seed from store.seeds(); score is the float
            from similarity, unrounded. With no seeds, on b"" and on garbage
            bytes it returns [] or a list, never an exception.
          guardrails: [Deterministic Output, Tolerant Parser]
          steps:
            - uses: store
            - produces: Alert
          examples:
            - given: 'a store with seed BELLE (0x34c6…, "BELLE honeypot")'
              when: 'match_watchlist(store, bytes of code_belle_copy_1807090d.hex)'
              then: 'one alert, label "BELLE honeypot", score 13/15'
            - given: 'the same store'
              when: 'match_watchlist(store, bytes of code_weth9.hex)'
              then: '[] (WETH9 vs BELLE is 9/16 = 0.5625)'
            - given: 'a store with no seeds, and then empty code b"" against the BELLE seed'
              when: 'match_watchlist is called'
              then: '[] both times'
              ref: 'Tolerant Parser'
        - name: Recheck Watchlist
          description: >
            recheck_watchlist(store, min_score=0.8, seed_addresses=None) ->
            list of Alert carrying address: every stored address whose code
            matches a seed of the watchlist, over the whole store, without
            the network. seed_addresses restricts the check to those seeds
            (any case, unknown ones simply match nothing); None means every
            seed of store.seeds(). This is what makes a copy of a scam
            already in the database visible: match_watchlist only ever sees
            a code arriving after the seed.
          behavior: >
            Each Alert has exactly the keys address, seed_address, label and
            score; address is the matching stored address, lowercase, and
            score is the float from similarity, unrounded. One similarity per
            (code_id, seed) pair, fanned out to addresses_of(code_id): the
            cost is distinct codes times seeds, never addresses times seeds.
            A seed never alerts on itself -- the single pair address ==
            seed_address is dropped -- while every other address of the
            seed's own code alerts with score 1.0. Addresses stored without
            code are never checked. The list is sorted by address ascending,
            then score descending, then seed_address ascending; it does not
            depend on insertion order, and two calls on the same store give
            equal lists. No seeds, an empty store, or seed_addresses naming
            nothing known give []. Reads the store through seeds(),
            fingerprints(), code_by_id() and addresses_of() only.
          guardrails: [Deterministic Output, No Network In Core]
          steps:
            - uses: store
            - uses: fingerprint
            - produces: Alert
          examples:
            - given: 'a store filled from codes_26077729.json, seed 0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc labelled "UniV2 pair seed"'
              when: 'recheck_watchlist(store) is called'
              then: >
                4 alerts, addresses ascending: 0x22052a1a…, 0x2621cc0b… and
                0x3041cbd3… with 1.0, then 0xcf6daab9… with 26/32 (0.8125);
                the seed address itself is absent
              ref: 'the three other UniswapV2Pair addresses of the same code plus the solc 0.6.12 pair of Find Similar'
            - given: 'the same store'
              when: 'recheck_watchlist(store, min_score=1.0), and then with seed_addresses=["0xB4E16D0168E52D35CACD2C6185B44281EC28C9DC"]'
              then: 'the three 1.0 alerts only; and the same 4 alerts as the default call (the seed address may come in any case)'
            - given: 'a store holding code_belle.hex at 0x34c6… seeded "BELLE honeypot" and its four copies code_belle_copy_*.hex at their addresses'
              when: 'recheck_watchlist(store) is called twice'
              then: >
                both times the same 4 alerts, each 13/15 (0.8667), in address
                order 0x1807…, 0x2141…, 0x46ca…, 0x6411…, label "BELLE
                honeypot"
              ref: 'Deterministic Output; the copies were already in the store when the seed was added'
            - given: 'that store with no seeds at all, and then with seed_addresses=["0x1111111111111111111111111111111111111111"]'
              when: 'recheck_watchlist is called'
              then: '[] both times'
      dataObjects:
        - name: Cluster
          description: One group of addresses.
          schema:
            level: '"L0" | "L1" | "proxy"'
            key: code_id, skeleton_hash, or "<kind>:<target>"
            members: sorted lowercase addresses
        - name: Alert
          description: >
            A code matching a seed, as match_watchlist returns it. Ingest
            Block adds the key address (the new address whose code matched)
            to every alert it passes on; Recheck Watchlist returns alerts
            with that key already set (the stored address that matched), so
            a cli record is written the same way whichever produced it.
          schema:
            seed_address: str
            label: str
            score: float
            address: 'str -- added by Ingest Block, returned by Recheck Watchlist'
    - name: rpc
      description: >
        The only network module: a minimal JSON-RPC client over an injected
        transport, with retry and backoff and credit accounting.
      functions:
        - name: RPC Client
          description: >
            RpcClient(url, transport=None, sleep=time.sleep, prices=None,
            on_spend=None, max_retries=3).call(method, params) -> result.
            transport(url, body: bytes) -> (status: int, body: bytes); the
            default is a urllib POST. infura_url(env_path=".env") builds
            https://mainnet.infura.io/v3/<key> from INFURA_API_KEY: the
            environment variable wins over the file; no key anywhere raises
            RpcError(None, "INFURA_API_KEY is not set").
          behavior: >
            HTTP 429 and 5xx, and an OSError raised by the transport, are
            retried after sleep(1), sleep(2), sleep(4) (doubling from 1, at
            most max_retries), then RpcError. A JSON-RPC error object raises
            RpcError(code, message) at once, no retry. RpcError.code is the
            JSON-RPC error code, the HTTP status once retries are exhausted,
            or None; the exception chain is suppressed (raise ... from None)
            so the transport's message never travels with it. After a
            successful call on_spend(method, prices[method]) is called once;
            on_spend is a plain hook for the caller and is NOT wired to the
            store ledger (Follow Chain writes the ledger itself, wiring both
            would count twice); prices come from configuration (ethsc/config.py), not from
            code in the client. ethsc/config.py holds PRICES =
            {"eth_blockNumber": 80, "eth_getBlockReceipts": 1000,
            "eth_getCode": 80}; the eth_blockNumber entry carries the comment
            "не подтверждено, сверить с дашбордом" (the other two are from the
            Infura method pages). RpcError text and repr never contain the URL
            or the key.
          requirements: [Offline Tests]
          guardrails: [No Network In Core, Secret Hygiene, Budget Respected]
          steps:
            - produces: RPC Response
          examples:
            - given: >
                a fake transport answering first with tests/fixtures/rpc_429.json
                (status 429, body {"code":-32005,"message":"Too Many Requests",...})
                and then status 200 with {"jsonrpc":"2.0","id":1,"result":<text of code_weth9.hex>}
              when: 'call("eth_getCode", ["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "latest"])'
              then: 'the result equals the text of code_weth9.hex; 2 transport calls; sleep called once, with 1'
              ref: 'rpc_429.json recorded from Infura 2026-09-28'
            - given: 'a fake transport that always answers rpc_429.json'
              when: 'call is made with max_retries=3'
              then: 'RpcError after 4 transport calls; sleeps [1, 2, 4]'
            - given: 'a fake transport answering 200 with {"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"block not found: 0x18deac1"}}'
              when: 'call is made'
              then: 'RpcError with code -32001 after 1 transport call and no sleep'
              ref: 'the error object Infura returned 2026-09-28 for a future block'
            - given: 'url https://mainnet.infura.io/v3/TESTKEY-0000 and a transport raising OSError("boom " + url)'
              when: 'call is made'
              then: 'RpcError whose str and repr do not contain "TESTKEY-0000"'
              ref: 'Secret Hygiene'
            - given: 'prices {"eth_getBlockReceipts": 1000, "eth_getCode": 80} and an on_spend collector'
              when: 'one successful eth_getBlockReceipts and two eth_getCode'
              then: 'the collector sums to 1160'
              ref: 'Infura credit table (eth_getBlockReceipts 1000, eth_getCode 80)'
      dataObjects:
        - name: RPC Response
          description: >
            A verbatim Infura JSON-RPC response body. Recorded samples:
            tests/fixtures/receipts_26077729.json (eth_getBlockReceipts),
            code_*.hex (eth_getCode result strings), rpc_429.json (status,
            headers, body of a rate-limited request).
          schema: see tests/fixtures/rpc_429.json and receipts_26077729.json
    - name: ingest
      description: >
        From a block to stored codes: candidate discovery from receipts,
        per-block ingest with an injected code fetcher, and chain following
        with resume and budgets.
      functions:
        - name: Discover Candidates
          description: >
            discover_candidates(receipts: list) -> sorted list of distinct
            lowercase addresses: every contractAddress, every to, and every
            logs[].address of the block's receipts.
          behavior: >
            null to and null contractAddress are skipped; from is not a
            candidate. Contracts created by factories are caught only when
            they emit a log (no trace_* on the free tier).
          guardrails: [Deterministic Output, Tolerant Parser]
          steps:
            - reads: RPC Response
          examples:
            - given: 'the "result" list of tests/fixtures/receipts_26077729.json (218 receipts, 626 logs)'
              when: 'discover_candidates is called'
              then: '206 addresses; 135 distinct to, 119 distinct log addresses, one contractAddress 0xb53c071bdb35d21aa1216b084f79c372d71053d5'
              ref: 'jq count over the fixture'
            - given: 'an empty list'
              when: 'discover_candidates is called'
              then: '[]'
        - name: Ingest Block
          description: >
            ingest_block(block, receipts, get_code, store, max_calls=None,
            watch=None, on_alerts=None) -> stats dict {candidates, known,
            fetched, contracts, eoas, failed, deferred, complete, alerts}.
            get_code(address, block) -> hex string is injected. watch is the
            min_score passed to match_watchlist; None means 0.8. on_alerts is
            an optional sink for the alerts of this block, called before the
            call returns or raises.
          behavior: >
            Candidates already in the store are skipped (known). Each other
            one costs one get_code call until max_calls is reached; the rest
            are deferred. complete = (deferred == 0). "0x" stores the address
            with code_id None (eoas); other code goes through put_code. A
            get_code that raises, or returns text that is not 0x-hex, counts
            as failed: the address is not stored, and it neither stops nor
            holds the block. Invariants of the stats: candidates = known +
            fetched + deferred and fetched = contracts + eoas + failed. Every
            newly stored address with code (not only a new code_id) is
            checked by match_watchlist; each alert is extended with the key
            address, so alerts is a list of {address, seed_address, label,
            score} ordered by address; alerts are returned, not printed.
            on_alerts, when given, is called exactly once per ingest_block
            call with that list, and it is called even when get_code raises
            KeyboardInterrupt: the alerts found before the interruption are
            handed over, sorted by address, before the exception leaves. An
            alert reaches on_alerts exactly once, so a caller that prints
            from on_alerts must not print the returned list as well.
          guardrails: [No Network In Core, Tolerant Parser, Budget Respected]
          steps:
            - calls: Discover Candidates
            - uses: store
            - uses: cluster
          examples:
            - given: 'receipts_26077729.json, a fresh store, and a fake get_code serving codes_26077729.json'
              when: 'ingest_block(26077729, …) is called'
              then: 'candidates 206, fetched 206, contracts 147, eoas 59, failed 0, complete True; the store has 130 codes'
              ref: 'counted over codes_26077729.json'
            - given: 'the same store after that call'
              when: 'ingest_block is called again for the same block'
              then: 'known 206, fetched 0, complete True'
            - given: 'a fresh store and max_calls=50'
              when: 'ingest_block is called five times'
              then: 'fetched 50, 50, 50, 50, 6; complete False four times, then True'
            - given: 'a fake get_code raising OSError for 0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc only'
              when: 'ingest_block is called'
              then: 'failed 1, fetched 206, contracts 146; the other three UniswapV2Pair addresses are stored'
              ref: 'Tolerant Parser'
            - given: >
                a store seeded with code_belle.hex as "BELLE honeypot", a block whose
                candidates are 0x1807090dd15a6f58e00fd769e32ebf20ee610385 (served
                code_belle_copy_1807090d.hex) and
                0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc, and a get_code that
                raises KeyboardInterrupt on the second address
              when: 'ingest_block is called with an on_alerts collecting into a list'
              then: 'KeyboardInterrupt propagates, and on_alerts was called once before it with the single alert for 0x1807090d… at 0.8667'
              ref: 'live smoke 2026-09-29: a Ctrl-C inside a block lost the alerts already found (TASK_PHASE5 §13)'
        - name: Follow Chain
          description: >
            follow_chain(rpc, store, start=None, stop=None,
            max_calls_per_block=None, daily_budget=None, day=None,
            prices=None, on_alerts=None) -> summary {blocks, stopped,
            progress, alerts, day}. day is a "%Y-%m-%d" string pinning every
            block of the pass, or a callable of no arguments returning one;
            day=None means today's UTC date, resolved afresh before each
            block. prices=None means {}. on_alerts is the per-block alert
            sink passed down to ingest_block. Polls
            eth_blockNumber, then for each block after progress (or from
            start) up to the head (or stop): eth_getBlockReceipts,
            ingest_block with get_code over eth_getCode.
          behavior: >
            Before every RPC call it checks spent(day) + price <= daily_budget
            and, if not, stops cleanly with stopped "budget" and progress at the
            last complete block. stopped is None when the range was walked to
            its end, "budget" when the daily budget cut it, "cap" when
            max_calls_per_block left a block incomplete. alerts is the
            concatenation of the alerts of every ingest_block call, in block
            order, the incomplete block included: an alert found before a
            budget or cap stop is never dropped with the block that carried
            it. on_alerts is handed to every ingest_block call, so a caller
            learns a block's alerts as that block ends, not when the pass
            does; a pass cut short by KeyboardInterrupt has already delivered
            the alerts of every block it walked, the interrupted one
            included, and the exception then propagates.
            Follow Chain is the only writer of the credit ledger:
            after each successful rpc call it does store.spend(day, method,
            prices.get(method, 0)); RpcClient.on_spend is left unconnected.
            set_progress runs only for a complete block; a rerun resumes the
            unfinished block, skipping known addresses. The ledger day is
            resolved once before the eth_blockNumber charge and again before
            each block, so a pass that runs across midnight UTC charges each
            block to the day it was actually walked on; an explicit day
            string pins every block of the pass, as the examples below do.
            summary day is the last day resolved, the one a caller reports
            spent() for.
          guardrails: [Budget Respected, No Network In Core]
          steps:
            - calls: Ingest Block
            - uses: rpc
            - uses: store
          examples:
            - given: >
                a fake rpc answering eth_blockNumber "0x18dea21",
                eth_getBlockReceipts from receipts_26077729.json and eth_getCode
                from codes_26077729.json; progress 26077728; prices blockNumber
                80, receipts 1000, getCode 80; daily_budget 3000000
              when: 'follow_chain is called'
              then: 'blocks 1, progress 26077729, spent 17560 (80 + 1000 + 206 × 80)'
              ref: 'prices from Infura''s credit table; counts from the fixtures'
            - given: 'the same, with daily_budget 10000'
              when: 'follow_chain is called'
              then: 'stopped "budget" after 111 eth_getCode calls, spent 9960, progress still 26077728'
              ref: '80 + 1000 + 111 × 80 = 9960 <= 10000 < 10040'
            - given: 'that store and a new day with daily_budget 3000000'
              when: 'follow_chain is called again'
              then: '95 eth_getCode calls, progress 26077729'
            - given: >
                a fake rpc with head 0x18dea22 answering receipts_26077729.json for
                both blocks and codes_26077729.json; progress 26077728; the Infura
                prices; daily_budget 3000000; day a callable yielding "2026-09-28",
                "2026-09-28", "2026-09-29"
              when: 'follow_chain is called'
              then: 'blocks 2, progress 26077730, spent("2026-09-28") 17560, spent("2026-09-29") 1000, summary day "2026-09-29"'
              ref: 'the day is resolved before eth_blockNumber and again before each block; the second block finds all 206 addresses known, so it pays only the 1000 of eth_getBlockReceipts'
            - given: >
                a store seeded with code_belle.hex as "BELLE honeypot"; a fake rpc
                over one block whose candidates are
                0x1807090dd15a6f58e00fd769e32ebf20ee610385 (served
                code_belle_copy_1807090d.hex) and
                0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc; max_calls_per_block 1
              when: 'follow_chain is called with an on_alerts collecting into a list'
              then: 'stopped "cap", progress unchanged, on_alerts called once with the single alert for 0x1807090d… at 0.8667, and summary alerts holds that same one'
              ref: 'discover_candidates sorts, so 0x1807… is fetched first; before phase 6 its alert was dropped together with the incomplete block'
    - name: cli
      description: python -m ethsc with subcommands over one SQLite db.
      functions:
        - name: Command Line
          description: >
            main(argv=None, rpc=None, sleep=None) -> exit code. Subcommands:
            listen [--daily-budget C] [--max-calls-per-block K]
            [--interval S], backfill --from N --to M [--daily-budget C]
            [--max-calls-per-block K], clusters top [--n K], cluster <addr>,
            similar <addr> [--min 0.8], seed add <addr> --label L, seed list,
            recheck [--min 0.8], report [--out PREFIX],
            risk [--flag {selfdestruct,mutable_delegatecall}].
            Global --db PATH (default ethsc.sqlite) before the subcommand.
            Without rpc, builds RpcClient(infura_url()), but only on the way
            into a subcommand that talks to the chain -- listen and
            backfill. Every other subcommand runs with INFURA_API_KEY unset
            and no .env in sight, and infura_url() is not called at all, so
            its RpcError never reaches the caller as a traceback.
            sleep=None means time.sleep, injected so listen can be stopped
            in a test. Entry point python -m ethsc: ethsc/__main__.py is a
            thin sys.exit(main()).
          behavior: >
            Output is plain text, one record per line, tab-separated, fully
            ordered; every float is printed "%.4f", exact inside. Records:
            "ALERT\t<address>\t<seed_address>\t<label>\t<score>" from
            backfill, listen, recheck and seed add; clusters top (K default 20):
            "<level>\t<key>\t<member count>"; cluster <addr>:
            "<level>\t<key>\t<members comma-joined>\t<flags>", 0 or 1 line,
            where <flags> is the risk flags of the queried address's code;
            similar: "<address>\t<score>\t<flags>"; risk: "<address>\t<flags>",
            one line per stored address whose code has at least one flag;
            seed list: "<address>\t<label>". A <flags> field is the set risk
            flags of that address's code as risk_flags gives them, the names
            that are True joined by "," in the fixed order selfdestruct then
            mutable_delegatecall, or "-" when neither is set (never an empty
            field); on cluster and similar it is always present, "-" included,
            so the record keeps a fixed column count. stdout
            holds only these records; stderr only one-line messages. Exit
            codes: 0 success; 1 RpcError out of follow_chain (stderr is
            str(err), no traceback); 2 usage error (argparse, a positional
            address not matching ^0x[0-9a-fA-F]{40}$, seed add on an
            address without code) and main returns argparse's code instead
            of raising SystemExit; 3 when a budget or cap stop left work
            undone, and then one line goes to stderr: "stopped: <budget|cap>,
            spent <credits> credits, progress <block>", where <block> is
            "none" when no block has ever completed and <credits> is the
            ledger of the day the pass last charged (summary day), not of
            the day it started on. The ALERT lines of a block are written
            and flushed as that block ends, through the on_alerts sink of
            follow_chain, not gathered until the pass returns: under nohup
            an alert must reach the log before the next block is fetched,
            and it must survive a pass that never returns. The returned
            summary alerts are therefore not printed a second time. listen
            is a loop of follow_chain passes with sleep(interval) between
            them (interval default 12); a code 3 stop ends the loop.
            KeyboardInterrupt anywhere in listen or backfill is a clean
            stop -- exit 0, no traceback, progress of the last complete
            block kept, the unfinished block resumed on the next start --
            and anywhere means the sleep, inside a pass (a transport call, a
            retry backoff), while the ALERT lines are being written, while
            the stop line is being written, and between a pass and the
            pause. recheck prints the alerts of recheck_watchlist(store,
            min_score=--min, 0.8 by default) over the whole database, one
            ALERT line each, in the order that function returns them, and
            exits 0 -- also with no seeds, no alerts or an empty database,
            where stdout stays empty. seed add, after a successful add_seed,
            prints the ALERT lines of recheck_watchlist(store,
            seed_addresses=[the new address]) at the fixed threshold 0.8:
            the copies of the new seed already in the database, which no
            listen or backfill will ever report again; its exit code stays
            0, and a seed add that fails still exits 2 with an empty
            stdout. Both write through the same ALERT sink as listen and
            backfill, make no rpc call of their own, and a second run on an
            unchanged database prints exactly the same bytes. report writes
            build_report(store, prefix) -- two files, <PREFIX>.html and
            <PREFIX>.json, PREFIX being --out, "ethsc-report" by default --
            and prints exactly two stdout records, the html path then the
            json path, one per line, in that order; stderr stays empty and
            the exit code is 0, also on an empty database. It is the one
            subcommand that needs matplotlib: with matplotlib absent it
            writes neither file, leaves stdout empty, prints one line on
            stderr naming matplotlib and exits 2 with no traceback. It makes
            no rpc call. risk prints one "<address>\t<flags>" record for every
            stored address whose code carries at least one risk flag (an
            address stored without code is never printed, and neither is a
            code whose flags are both False), sorted by address ascending;
            --flag NAME restricts the listing to the addresses whose code has
            that one flag and prints only that name in the <flags> field.
            risk reads flags with risk_flags over the code of each address,
            makes no rpc call, exits 0 -- also with an empty database, where
            stdout stays empty -- and two runs on an unchanged database print
            byte-identical stdout. Nothing printed ever contains the key.
          requirements: [Offline Tests]
          guardrails: [Secret Hygiene, Deterministic Output]
          steps:
            - uses: ingest
            - uses: cluster
            - uses: store
            - uses: evm
          examples:
            - given: 'a fake rpc over receipts_26077729.json and codes_26077729.json'
              when: 'main(["--db", db, "backfill", "--from", "26077729", "--to", "26077729"], rpc=fake)'
              then: 'exit 0 and the db holds 206 addresses and 130 codes'
            - given: 'that db'
              when: 'main(["--db", db, "similar", "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc", "--min", "0.8"])'
              then: '4 lines, the three UniswapV2Pair addresses with 1.0000 first, 0xcf6daab9… with 0.8125 last'
            - given: 'a db holding code_belle.hex, seeded with seed add 0x34c6… --label "BELLE honeypot"'
              when: 'a backfill over a fake block whose only candidate is 0x1807090dd15a6f58e00fd769e32ebf20ee610385 serving code_belle_copy_1807090d.hex'
              then: 'one stdout line starts "ALERT" and names 0x1807090dd15a6f58e00fd769e32ebf20ee610385, "BELLE honeypot" and 0.8667'
            - given: 'an environment with INFURA_API_KEY=TESTKEY-0000 and an rpc that raises RpcError'
              when: 'main(["--db", db, "listen"]) is run'
              then: 'exit 1, no traceback, and "TESTKEY-0000" nowhere in stdout or stderr'
              ref: 'Secret Hygiene'
            - given: 'a fresh db and the fake rpc over block 26077729'
              when: 'main(["--db", db, "backfill", "--from", "26077729", "--to", "26077729", "--daily-budget", "79"])'
              then: 'exit 3, stdout empty, stderr exactly one line starting "stopped: budget"'
              ref: 'eth_blockNumber costs 80 > 79; the cli acceptance of phase 5'
            - given: 'a fake rpc whose eth_getCode raises KeyboardInterrupt on its first call, progress 26077728'
              when: 'main(["--db", db, "listen"], rpc=fake, sleep=fake_sleep)'
              then: 'exit 0, no traceback, progress still 26077728, sleep never called'
              ref: 'live smoke 2026-09-29: Ctrl-C during a block gave a traceback (TASK_PHASE5 §13)'
            - given: 'the same fake rpc over block 26077729, progress 26077728, and a sleep that raises KeyboardInterrupt'
              when: 'main(["--db", db, "listen"], rpc=fake, sleep=that_sleep)'
              then: 'exit 0, sleep called once with 12, progress 26077729'
            - given: >
                a db holding code_belle.hex seeded as "BELLE honeypot", progress
                26077728, and a fake rpc with head 0x18dea22 whose only candidate
                in block 26077729 is 0x1807090dd15a6f58e00fd769e32ebf20ee610385
                with code_belle_copy_1807090d.hex, raising KeyboardInterrupt on
                its fourth call -- the eth_getBlockReceipts of block 26077730
              when: 'main(["--db", db, "listen"], rpc=fake, sleep=fake_sleep)'
              then: 'exit 0, no traceback, stdout holds the one ALERT line of block 26077729, progress 26077729, sleep never called'
              ref: 'the alert of a block completed inside an interrupted pass must reach stdout; before phase 6 it was lost forever, since the address is known on the resume'
            - given: >
                the db of the backfill above (206 addresses of block
                26077729), seeded with seed add
                0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc --label "UniV2
                pair seed"
              when: 'main(["--db", db, "recheck"]) is run twice'
              then: >
                exit 0 both times and byte-identical stdout: 4 ALERT lines,
                0x22052a1a…, 0x2621cc0b…, 0x3041cbd3… with 1.0000, then
                0xcf6daab9… with 0.8125, all naming the seed and "UniV2 pair
                seed"; stderr empty
              ref: 'Deterministic Output; no network, the whole check is the stored codes'
            - given: >
                a db holding code_belle.hex at
                0x34c6211621f2763c60eb007dc2ae91090a2d22f6 and its four
                copies code_belle_copy_*.hex at 0x1807…, 0x2141…, 0x46ca…,
                0x6411…, with no seed yet
              when: 'main(["--db", db, "seed", "add", "0x34C6211621F2763C60EB007DC2AE91090A2D22F6", "--label", "BELLE honeypot"])'
              then: >
                exit 0 and exactly 4 ALERT lines on stdout, one per copy in
                address order, each with 0.8667 and the seed address
                lowercase; the seed's own address is not among them
              ref: 'TASK_PHASE6_2 §7: copies already in the base never produced an alert'
            - given: 'a db with addresses but no seeds, and then the same db with --min 1.0'
              when: 'main(["--db", db, "recheck"]) and main(["--db", db, "recheck", "--min", "1.0"])'
              then: 'exit 0 and empty stdout in the first case; in the second only the alerts with score exactly 1.0000'
            - given: 'the db of the backfill above (206 addresses of block 26077729) and an empty temp directory'
              when: 'main(["--db", db, "report", "--out", tmp + "/r"]) is run twice'
              then: >
                exit 0 both times, stderr empty, stdout exactly two lines --
                "<tmp>/r.html" then "<tmp>/r.json" -- and both files
                byte-identical between the two runs
              ref: 'Deterministic Output; matplotlib 3.11.2 with svg.hashsalt fixed and metadata Date None'
            - given: 'INFURA_API_KEY unset, no .env in the working directory, and a db holding block 26077729'
              when: 'main(["--db", db, "report", "--out", tmp + "/r"]), main(["--db", db, "clusters", "top"]) and main(["--db", db, "recheck"]) are run with rpc=None'
              then: 'exit 0 each time and no RpcError, because infura_url() is never called outside listen and backfill'
              ref: 'before this phase every subcommand built the rpc client first and died on a traceback from ethsc/rpc.py without a key'
            - given: 'the same db and an import of ethsc.charts that raises ImportError'
              when: 'main(["--db", db, "report", "--out", tmp + "/r"]) is run'
              then: 'exit 2, stdout empty, no file written, and stderr exactly one line naming matplotlib, with no traceback'
            - given: 'the db of the backfill above (206 addresses of block 26077729)'
              when: 'main(["--db", db, "risk"]) is run twice'
              then: >
                exit 0 both times and byte-identical stdout: 34 lines, the
                first "0x07696dcab55e62cfef953666b29fe1970518cb00
                mutable_delegatecall" and the last
                "0xfeeeeee44046c3f61a8cc081e0918ef0de0a7ffc selfdestruct";
                stderr empty
              ref: 'counted over codes_26077729.json: 33 addresses mutable_delegatecall + 1 selfdestruct, no overlap; Deterministic Output'
            - given: 'the same db'
              when: 'main(["--db", db, "risk", "--flag", "selfdestruct"]) is run'
              then: 'exit 0 and exactly one line, "0xfeeeeee44046c3f61a8cc081e0918ef0de0a7ffc\tselfdestruct"'
              ref: 'the one code with a SELFDESTRUCT opcode in the block'
            - given: 'the same db'
              when: 'main(["--db", db, "cluster", "0x28b5a0e9c621a5badaa536219b3a228c8168cf5d"]) is run'
              then: >
                exit 0 and one line whose fourth tab field is
                "mutable_delegatecall": an L0 cluster of two addresses
                0x28b5a0e9c621a5badaa536219b3a228c8168cf5d and
                0x81d40f21f12a8f0e3252bccb954d722d4c464b64 sharing one code
              ref: 'two addresses of one code that has DELEGATECALL, SLOAD and is no eip1167'
            - given: 'the same db'
              when: 'main(["--db", db, "similar", "0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc", "--min", "0.8"]) is run'
              then: >
                exit 0 and 4 lines, each ending in a "-" field (the three
                UniswapV2Pair matches at 1.0000 and 0xcf6daab9... at 0.8125
                all carry no risk flag), the score still the field before it
              ref: 'the flag column is always present; UniswapV2Pair has no SELFDESTRUCT and no DELEGATECALL opcode'
    - name: report
      description: >
        One offline report over the whole database: a self-contained HTML
        page whose charts are embedded SVG, and a JSON holding the same
        numbers. Every number lives in ethsc/report.py and is computed by
        the standard library alone; the drawing is a group apart, charts,
        which is the only place matplotlib may be imported. No network, no
        JavaScript, no external resource of any kind in the HTML.
      functions:
        - name: Collect Report Data
          description: >
            collect(store) -> ReportData, every number of the report and not
            one chart. Standard library only: it must import and run with
            matplotlib absent. Reads the store through counts(),
            ledger_days(), fingerprints(), code_by_id(), addresses_of() and
            seeds() only, and calls build_clusters and recheck_watchlist for
            the cluster and alert sections.
          behavior: >
            The nine sections, under exactly the keys summary, levels,
            skeletons, clusters, codes, ledger, alerts, spearman, risk.
            summary is store.counts() verbatim. levels holds, per level
            "L0", "L1" and "proxy", the number of clusters, the number of
            distinct member addresses and that number over
            summary["addresses_with_code"]; the three shares do not sum to
            one, because one address may sit in both an L0 and an L1
            cluster; it also holds proxy_codes and proxy_code_share over
            summary["codes"]. skeletons answers the phase 5 prediction:
            over non-proxy codes only, non_proxy_codes, unique_codes (codes
            whose skeleton_hash belongs to no other non-proxy code),
            unique_share, and the same weighted by addresses --
            non_proxy_addresses, unique_addresses, unique_address_share.
            clusters is the 20 largest clusters as {level, key, size},
            in the order build_clusters returns them, plus the histogram of
            every cluster size over the fixed edges [2, 3, 4, 5, 9, 17, 33,
            65]. codes holds, for bytecode size and for selector count,
            min, median, max and a histogram over fixed edges: [0, 256,
            1024, 4096, 8192, 16384, 24576] bytes and [0, 1, 2, 4, 8, 16,
            32, 64] selectors. The edges are fixed, never derived from the
            data, so two bases are comparable. median is the true median and
            always a float: the mean of the two middle values when the count
            is even, the middle value itself when it is odd, 0.0 on an empty
            base. min and max stay ints. ledger is
            store.ledger_days() plus their total. alerts is
            recheck_watchlist(store) folded per seed into {address, label,
            count}, sorted by address, plus the total. risk carries, under
            the two keys selfdestruct and mutable_delegatecall, the reach of
            each flag over the base as risk_flags(code) gives it: codes (the
            number of distinct codes with the flag), code_share over
            summary["codes"], addresses (the number of addresses with code
            whose code has the flag) and address_share over
            summary["addresses_with_code"]. Both shares are 0.0 when the
            denominator is 0. The whole structure
            is built of ints, floats, strings, lists and dicts only, holds
            no path, no date and no object address, and two calls on the
            same store give equal structures.
          requirements: [Stdlib Only, Offline Tests]
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - uses: store
            - uses: cluster
            - uses: evm
            - produces: Report Data
          examples:
            - given: 'a store filled from codes_26077729.json (206 addresses, 147 with code, 130 codes)'
              when: 'collect(store)["levels"] is read'
              then: >
                L0 7 clusters over 16 addresses, L1 2 over 13, proxy 6 over
                14; the shares 16/147, 13/147 and 14/147; proxy_codes 12 and
                proxy_code_share 12/130
              ref: 'counted over codes_26077729.json; cluster counts match Build Clusters'
            - given: 'the same store'
              when: 'collect(store)["skeletons"] is read'
              then: >
                non_proxy_codes 118, unique_codes 105, unique_share
                105/118 = 0.8898; non_proxy_addresses 127,
                unique_addresses 114, unique_address_share 114/127 = 0.8976
              ref: 'the prediction of docs/TASK_PHASE5.md §9 was refuted on the live base at 75.7% by code_id and 54.6% by address; on one block it is higher still'
            - given: 'the same store'
              when: 'collect(store)["codes"] is read'
              then: >
                bytecode size min 20, median 4442.5, max 24313, histogram
                [22, 5, 36, 19, 23, 25, 0]; selector count min 0, median
                12.5, max 72, histogram [28, 2, 3, 16, 27, 35, 17, 2]
              ref: '130 codes, so both medians average the two middle values: 4369 and 4516, 12 and 13'
            - given: 'the same store, plus seed 0xb4e16d0168e52d35cacd2c6185b44281ec28c9dc labelled "UniV2 pair seed"'
              when: 'collect(store)["alerts"] is read'
              then: 'total 4 and one seed entry, that address, label "UniV2 pair seed", count 4'
              ref: 'the four alerts of Recheck Watchlist in the cluster group'
            - given: 'a store filled from codes_26077729.json (130 codes, 147 addresses with code)'
              when: 'collect(store)["risk"] is read'
              then: >
                selfdestruct codes 1, addresses 1, code_share 1/130 and
                address_share 1/147; mutable_delegatecall codes 29,
                addresses 33, code_share 29/130 and address_share 33/147
              ref: 'counted over codes_26077729.json, 2026-09-30'
            - given: 'an empty database'
              when: 'collect(store) is called'
              then: >
                all nine keys present, summary all zeros, clusters, ledger and
                alert lists empty, both risk flags 0 codes and 0.0 shares, and
                no exception
        - name: Spearman Matrix
          description: >
            spearman(rows) -> {"features": [...], "n": int, "matrix":
            [[...]]}, the rank correlation of the six numeric features of a
            code over every code of the base. The features, in this fixed
            order: bytecode_size, opcode_count, selector_count,
            address_count, l1_family_size, is_proxy.
          behavior: >
            bytecode_size is the fingerprint size, opcode_count is
            len(disassemble(code)), selector_count is the length of the
            selector list, address_count is len(addresses_of(code_id)),
            l1_family_size is the number of distinct code_id sharing this
            code's skeleton_hash counted over every code of the base,
            proxies included -- which is not the L1 cluster of Build
            Clusters, where proxies are excluded -- and is_proxy is 1 or 0.
            Ties are ranked by their average rank and the coefficient is
            then Pearson's on those ranks; the shortcut 1 - 6*sum(d^2)/(n*(n^2-1))
            is wrong here and forbidden, because the base is full of ties
            (on one block 117 of 130 codes share one address_count). The
            matrix is square in the feature order, symmetric, with 1.0 on
            the diagonal. A feature with zero variance -- every value equal,
            as is_proxy on a base with no proxy -- gives null in every cell
            of its row and column, the diagonal included, and never a zero
            and never an exception. Fewer than two codes gives null
            everywhere. Standard library only: no numpy, no statistics
            beyond what is written here.
          requirements: [Stdlib Only]
          guardrails: [Deterministic Output]
          steps:
            - uses: evm
            - uses: store
          examples:
            - given: 'the store from codes_26077729.json, n = 130 codes'
              when: 'the matrix is read'
              then: >
                bytecode_size~opcode_count 0.9893, bytecode_size~selector_count
                0.8422, bytecode_size~address_count -0.3368,
                opcode_count~selector_count 0.8559,
                address_count~is_proxy 0.4289, l1_family_size~is_proxy 0.2326
              ref: 'computed independently on the fixture with average ranks, 29.09'
            - given: 'the same store'
              when: 'bytecode_size~address_count and address_count~is_proxy are compared with the tie-blind shortcut'
              then: >
                the correct values are -0.3368 and 0.4289 while the shortcut
                gives 0.1898 and 0.8509 -- these two numbers are what
                catches wrong tie handling
              ref: 'both computed on codes_26077729.json, 29.09'
            - given: 'the rows [(1, 10), (2, 20), (2, 30), (3, 40)] as two features'
              when: 'their coefficient is computed'
              then: '0.9486832980505138, the average ranks being [1.0, 2.5, 2.5, 4.0]'
            - given: 'a base of non-proxy codes only'
              when: 'the matrix is read'
              then: 'every cell of the is_proxy row and column is null, the diagonal included, and the other four features keep their coefficients'
        - name: Render Report
          description: >
            build_report(store, prefix, charts=None) -> (html_path,
            json_path) writes prefix + ".html" and prefix + ".json" and
            returns their paths. render_html(data, svgs) -> str builds the
            page from collected data and a mapping of chart name to SVG
            text. With charts None, build_report imports ethsc.charts and
            raises ChartsUnavailable on ImportError, having written
            nothing.
          behavior: >
            The JSON is json.dump of the collected data with sort_keys
            True, indent 2 and a trailing newline: no path, no date, no id.
            The HTML is one file with no script tag, no link tag, no img
            tag and no http:// or https:// reference of any kind -- the five
            SVGs are inlined verbatim, each stripped of its XML declaration
            and its DOCTYPE, so nothing is ever fetched. It carries the
            summary, the level and skeleton shares, the top clusters, the
            ledger, the alerts per seed, the Spearman coefficients as a
            table beside the heat map, and the risk flags as a small table --
            per flag its code count, code share, address count and address
            share, every share "%.4f" -- with no chart of its own; every
            float printed "%.4f" and every
            null cell printed as the literal "n/a" -- never as an empty
            cell, which would read as a coefficient of zero. Two runs on the same store
            in the same environment give byte-identical html and json. The
            charts mapping has exactly the keys cluster_sizes, top_clusters,
            code_sizes, selector_counts and spearman; an absent or extra key
            is an error, not a silently missing picture.
          requirements: [Stdlib Only, Deterministic Output]
          guardrails: [Deterministic Output]
          steps:
            - uses: store
            - uses: Report Data
          examples:
            - given: 'the store from codes_26077729.json and five stub SVG strings'
              when: 'render_html(collect(store), stubs) is called twice'
              then: 'the two strings are equal, all five stubs appear in them, and "<script", "<link", "<img" and "http" do not'
            - given: 'that store and a prefix in a temp directory'
              when: 'build_report(store, prefix) is run twice with matplotlib installed'
              then: 'both files byte-identical between the runs, and json.load of the second gives back exactly collect(store)'
            - given: 'the same store and an ethsc.charts whose import raises ImportError'
              when: 'build_report(store, prefix) is called'
              then: 'ChartsUnavailable is raised and neither file exists'
      dataObjects:
        - name: Report Data
          description: >
            What collect returns and the JSON holds, the input of both
            render_html and render_charts.
          schema: >
            summary{addresses, addresses_with_code, addresses_without_code,
            codes, blocks}; levels{L0|L1|proxy -> {clusters, addresses,
            share}, proxy_codes, proxy_code_share};
            skeletons{non_proxy_codes, unique_codes, unique_share,
            non_proxy_addresses, unique_addresses, unique_address_share};
            clusters{top[{level, key, size}], histogram{edges, counts}};
            codes{size{min, median, max, histogram{edges, counts}},
            selectors{min, median, max, histogram{edges, counts}}};
            ledger{days[{day, credits}], total};
            alerts{seeds[{address, label, count}], total};
            spearman{features[6], n, matrix[6][6] of float or null};
            risk{selfdestruct|mutable_delegatecall -> {codes, code_share,
            addresses, address_share}}
    - name: charts
      description: >
        The drawing layer, and the only module of the package allowed a
        third-party import. It holds no number of its own: everything it
        draws comes from Report Data, which the stdlib-only report group
        computed. Kept a group apart so the one exception to Stdlib Only
        has a boundary a guard can check: matplotlib inside ethsc/charts.py,
        nowhere else in ethsc/.
      functions:
        - name: Draw Charts
          description: >
            ethsc/charts.py, the only module allowed to import matplotlib.
            render_charts(data) -> dict of the five SVG strings keyed
            cluster_sizes, top_clusters, code_sizes, selector_counts and
            spearman. It computes nothing: every number it draws comes from
            data.
          behavior: >
            cluster_sizes is the cluster-size histogram on a logarithmic
            count axis; top_clusters is a horizontal bar of the largest
            clusters by address count, labelled "<level> <key[:10]>";
            code_sizes and selector_counts are the two histograms of the
            codes section; spearman is the heat map of the matrix on a
            diverging scale from -1 to 1. A null cell is drawn visibly
            undefined -- hatched or flat grey, carrying the text "n/a", and
            named in the legend -- never left blank: on a diverging scale
            zero is nearly white, so a blank cell would read as "no
            correlation" where it means "undefined".
            Determinism is bought with four settings and nothing else:
            matplotlib.use("Agg") before pyplot, rcParams["svg.hashsalt"]
            fixed to a constant string, rcParams["svg.fonttype"] = "none",
            and savefig(format="svg", metadata={"Date": None}); every figure
            is closed. fonttype "none" keeps every label a real <text>
            element instead of glyph paths, which is what lets the "n/a"
            marks be read back out of the SVG, and it embeds no font file. Byte-identical
            output is promised within one environment and one matplotlib
            version, not across versions.
          guardrails: [Deterministic Output]
          steps:
            - uses: Report Data
          examples:
            - given: 'the collected data of codes_26077729.json, matplotlib 3.11.2'
              when: 'render_charts is called twice in two separate processes'
              then: 'five keys both times and each SVG byte-identical between the processes, with no "<dc:date>" and no "Created with matplotlib" in any of them'
              ref: 'measured 29.09: sha256 d6f53e0858cb92ac… reproduced across PYTHONHASHSEED 7 and 99'
            - given: 'a matrix holding null cells'
              when: 'the heat map is drawn'
              then: 'no exception, and every null cell carries the "n/a" mark and a fill distinguishable from the zero of the diverging scale'
Requirement:
  - name: Stdlib Only
    description: >
      Python 3.12 runtime, standard library only (urllib, sqlite3, hashlib,
      json, unittest; pytest is the test runner). Syntax stays 3.9-compatible
      because the card acceptance checks it. Exactly one exception, added
      2026-09-29: ethsc/charts.py may import matplotlib, because nothing in
      the standard library draws a chart. No other module of ethsc/ may
      import it -- not ethsc/report.py either: every number, including the
      Spearman coefficients, is computed by the standard library and
      matplotlib only draws. The package imports and every subcommand but
      report runs with matplotlib absent; report then exits 2 with one line
      on stderr.
  - name: Offline Tests
    description: >
      No test opens a network connection. All chain data comes from
      tests/fixtures/*, verbatim Infura responses fetched 2026-09-28 (block
      26077729 and named addresses); see tests/fixtures/README.md.
  - name: Real Fixtures
    description: >
      Every number in the examples is read from a fixture or an independent
      source (Sourcify-verified ABI, Etherscan label, published selector,
      Infura credit table, byte diff of fixtures); none is invented.
Guardrail:
  - name: No Network In Core
    description: >
      Only ethsc/rpc.py imports urllib, http or socket. Every other module
      gets a transport, a fetcher or an rpc object injected.
  - name: Secret Hygiene
    description: >
      The Infura key is read only from the environment or .env and never
      appears in logs, exceptions, printed URLs, fixtures, specs, decks or
      commits. .env is in .gitignore.
  - name: Budget Respected
    description: >
      The per-block call cap and the daily credit budget are never exceeded:
      the check happens before the call. Method prices in credits live in
      configuration, not in code.
  - name: Tolerant Parser
    description: >
      Truncated or garbage bytecode, empty code and the failure of one
      address give None, [] or a skip, never an exception that kills the
      block.
  - name: Deterministic Output
    description: >
      Every report and list is totally ordered; the output does not depend
      on insertion order.
