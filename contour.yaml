              ref: 'phase 15: the block a Ctrl-C interrupts keeps its printed alerts'
            - given: 'the fake rpc of the first example (receipts_26077729.json, codes_26077729.json, head "0x18dea21"), progress 26077728, prices {}, and a fake rpc with head "0x18dea22" answering the same receipts for both blocks on a second fresh store'
              when: 'follow_chain is called on each'
              then: >
                blocks 1 then blocks 2; store.events() is [] and
                event_counts()["kinds"] is {"ALERT": 0, "UPGRADE": 0} both
