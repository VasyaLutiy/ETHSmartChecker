    - name: dashboard
      description: >
        The live dashboard backend (phase 15): ethsc/dashboard.py, a
        standard-library HTTP server (http.server.ThreadingHTTPServer) on
        localhost that answers JSON about the store a running listener
        fills, and serves the static frontend built in dashboard/dist (a
        TypeScript phase of its own, out of scope here: this group fixes
        the JSON it is built against). Read-only: it opens
        Store(db, readonly=True) per request and never writes.
      functions:
        - name: Answer Request
          description: >
            respond(db_path, target, static_dir=None, now=None, cache=None)
            -> (status int, content_type str, body bytes): the whole HTTP
            behaviour for one GET, without a socket, so every endpoint is
            testable offline. target is the request target as the server
            receives it (path plus an optional "?query"). now is an aware
            UTC datetime or None (None: datetime.now(timezone.utc)). cache
            is the dict holding the clusters cache, None meaning the module's
            own dict.
          behavior: >
            JSON answers have content_type "application/json;
            charset=utf-8" and body json.dumps(obj, sort_keys=True) encoded
            UTF-8. A Store(db_path, readonly=True) is opened for an /api/
            request and closed before respond returns (try/finally): short
            transactions, the listener never waits on the dashboard. Times
            are text "%Y-%m-%dT%H:%M:%SZ" in UTC.
            GET /api/health -> {"progress": get_progress(), "progress_at":
            progress_at(), "seconds_since_progress": whole seconds from
            progress_at to now (int, floor) or None when progress_at is
            None, "now": now as text}.
            GET /api/events?after=<id>&limit=<n> -> {"events":
            store.events(after, limit), "last_id": the largest id in events,
            or after when events is empty}; after defaults to 0 and is a
            decimal integer >= 0; limit defaults to 100 and is a decimal
            integer 1..500.
            GET /api/summary -> {"addresses": counts()["addresses"],
            "codes": counts()["codes"], "seeds": len(seeds()), "origins":
            {"created", "seen", "impl", "fetched", "unknown"} from
            origin_counts() (each of the five keys always present, 0 when
            absent; another text is not reported), "implementations_resolved":
            the number of implementations() values whose implementation is
            not None, "alerts_by_seed": event_counts()["seeds"], "recent":
            {"blocks": 300, "by_origin": the same five keys from
            origin_counts(since_block=progress - 299)}} -- recent covers the
            addresses of the last 300 blocks up to progress (block >=
            progress - 299); with progress None every by_origin value is 0.
            GET /api/clusters?level=<L0|L1|proxy|eip7702|impl>&n=<k> ->
            {"level": level, "n": n, "clusters": the first n Cluster rows of
            that level in build_clusters order, each the build_clusters dict
            unchanged}; level is required; n defaults to 20 and is a decimal
            integer 1..100. build_clusters(store) runs at most once per 60 s
            per db_path: the cache maps db_path to (time.monotonic() at the
            build, the full list) and an entry younger than 60 s is reused
            for every level and n. The clock is read as time.monotonic()
            through the time module (import time), so a test patching
            time.monotonic controls the cache age.
            GET / -> the file index.html of static_dir, "text/html;
            charset=utf-8"; GET /assets/<rel> -> the file static_dir/assets/<rel>,
            content_type from mimetypes.guess_type (application/octet-stream
            when None). When static_dir is None or not a directory, GET /
            answers 200 with one built-in "text/html; charset=utf-8" page
            that names the four endpoints /api/health, /api/events,
            /api/summary and /api/clusters, and /assets/* is 404. The path
            is percent-decoded before it is resolved; a path whose resolved
            real path is not inside static_dir (.., an encoded .., a
            symlink out) is 404, and so is a missing file.
            Errors: an unknown path (anything else, "/api/health/" and
            "/favicon.ico" included) -> 404 {"error": "not found"}; a bad
            query value -> 400 {"error": <one line naming the parameter>};
            any exception while answering (a missing db file, a db older
            than phase 13, anything) -> 500 {"error": <one line>}; a body
            never holds a traceback. Unknown query parameters are ignored. A
            db without the events table answers [] and zeros, not 500 (Open
            Read Only).
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - reads: Code Database
            - uses: store
            - uses: cluster
          examples:
            - given: >
                a db made by block_store(), then set_progress(26077729), closed;
                p = its progress_at(), and now = the datetime of p plus 7 s
              when: 'respond(db, "/api/health", now=now) and respond(db, "/api/health?x=1", now=now)'
              then: >
                status 200, content_type "application/json; charset=utf-8",
                body json.dumps({"now": <now as text>, "progress": 26077729,
                "progress_at": p, "seconds_since_progress": 7},
                sort_keys=True).encode("utf-8"), both times
              ref: 'phase 15 heartbeat'
            - given: 'a fresh db (Store(path) opened and closed, nothing written)'
              when: 'respond(db, "/api/health", now=<2026-10-02T08:00:00Z>), respond(db, "/api/events") and respond(db, "/api/summary")'
              then: >
                200 each; health {"now": "2026-10-02T08:00:00Z", "progress":
                None, "progress_at": None, "seconds_since_progress": None};
                events {"events": [], "last_id": 0}; summary {"addresses": 0,
                "codes": 0, "seeds": 0, "origins": five keys all 0,
                "implementations_resolved": 0, "alerts_by_seed": [], "recent":
                {"blocks": 300, "by_origin": five keys all 0}}
            - given: 'a db made by block_store() plus five ALERT events with blocks 1..5 added by add_events (Record Events example 2), closed'
              when: 'respond on "/api/events", "/api/events?after=2&limit=2", "/api/events?after=5" and "/api/events?limit=500"'
              then: >
                200 each; ids [5, 4, 3, 2, 1] with last_id 5; ids [5, 4] with
                last_id 5; events [] with last_id 5; ids [5, 4, 3, 2, 1] with
                last_id 5; each event a dict with exactly the eleven Event keys
              ref: 'phase 15 polling: the next call passes after=last_id'
            - given: 'the db of the example above'
              when: >
                respond on "/api/events?limit=0", "/api/events?limit=501",
                "/api/events?limit=x", "/api/events?after=-1",
                "/api/events?after=1.5", "/api/clusters",
                "/api/clusters?level=L9", "/api/clusters?level=L0&n=0" and
                "/api/clusters?level=L0&n=101"
              then: 'status 400 each, content_type "application/json; charset=utf-8", body a JSON object with exactly the key "error", a non-empty str without "Traceback"'
            - given: >
                a db made by block_store(), add_events of the three ALERT and
