            - given: 'the store of example 14 (made afresh) and InterruptAfter(the FakeRpc of example 14, 3) -- eth_blockNumber, eth_getBlockReceipts and the eth_getCode of 0x1807… are answered, the eth_getCode of 0xb4e1… raises KeyboardInterrupt'
              when: 'follow_chain is called with an on_alerts collecting into a list'
              then: >
                KeyboardInterrupt propagates; on_alerts received the one alert
