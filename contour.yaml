                set_progress(26077729), closed
              when: 'respond(db, "/api/summary")'
              then: >
                200, body {"addresses": 206, "codes": 130, "seeds": 0,
                "origins": {"created": 0, "fetched": 0, "impl": 0, "seen": 0,
