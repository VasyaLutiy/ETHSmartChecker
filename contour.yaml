    - name: cli
      description: python -m ethsc with subcommands over one SQLite db.
      functions:
        - name: Command Line
          description: >
            main(argv=None, rpc=None, sleep=None) -> exit code. Subcommands:
            listen [--daily-budget C] [--max-calls-per-block K]
            [--interval S] [--source {infura,publicnode}] [--workers K]
            [--alert-on {created,seen,all}],
            backfill --from N --to M [--daily-budget C]
            [--max-calls-per-block K] [--source {infura,publicnode}]
            [--workers K] [--alert-on {created,seen,all}], clusters top
            [--n K], cluster <addr>,
            similar <addr> [--min 0.8], seed add <addr> --label L [--fetch],
            seed remove <addr>, seed list,
            recheck [--min 0.8] [--origin {created,seen,fetched,impl,unknown}],
            report [--out PREFIX],
            risk [--flag {selfdestruct,mutable_delegatecall}],
            dashboard [--host 127.0.0.1] [--port 8080] [--static DIR]
            (phase 15).
            Global --db PATH (default ethsc.sqlite) before the subcommand.
            Without rpc, builds RpcClient(infura_url()), but only on the way
            into a subcommand that talks to the chain -- listen and
            backfill -- and, keyless, for seed add --fetch on an address the
            store does not hold (phase 12). Every other subcommand runs with INFURA_API_KEY unset
            and no .env in sight, and infura_url() is not called at all, so
            its RpcError never reaches the caller as a traceback.
            sleep=None means time.sleep, injected so listen can be stopped
            in a test. Entry point python -m ethsc: ethsc/__main__.py is a
            thin sys.exit(main()).
          behavior: >
            Output is plain text, one record per line, tab-separated, fully
            ordered; every float is printed "%.4f", exact inside. Records:
            "ALERT\t<address>\t<seed_address>\t<label>\t<score>\t<origin>"
            from backfill, listen, recheck and seed add (six fields since
            phase 13; <origin> is the alert's origin key); clusters top (K default 20):
            "<level>\t<key>\t<member count>"; cluster <addr>:
            "<level>\t<key>\t<members comma-joined>\t<flags>", 0, 1 or 2 lines
            (phase 14: a standard proxy may sit in an L0 and an impl cluster;
            lines in build_clusters order), where <flags> is the risk flags
            of the queried address's code;
            similar: "<address>\t<score>\t<flags>"; risk: "<address>\t<flags>",
            one line per stored address whose code has at least one flag;
            seed list: "<address>\t<label>". A <flags> field is the set risk
            flags of that address's code as risk_flags gives them, the names
            that are True joined by "," in the fixed order selfdestruct then
            mutable_delegatecall, or "-" when neither is set (never an empty
            field); on cluster and similar it is always present, "-" included,
            so the record keeps a fixed column count. stdout
            holds only these records; stderr only one-line messages. Exit
            codes: 0 success; 1 RpcError out of follow_chain (stderr is
            str(err), no traceback); 2 usage error (argparse, a positional
            address not matching ^0x[0-9a-fA-F]{40}$, seed add on an
            address without code) and main returns argparse's code instead
            of raising SystemExit; 3 when a budget or cap stop left work
            undone, and then one line goes to stderr: "stopped: <budget|cap>,
            spent <credits> credits, progress <block>", where <block> is
            "none" when no block has ever completed and <credits> is the
            ledger of the day the pass last charged (summary day), not of
            the day it started on. The ALERT lines of a block are written
            and flushed as that block ends, through the on_alerts sink of
            follow_chain, not gathered until the pass returns: under nohup
            an alert must reach the log before the next block is fetched,
            and it must survive a pass that never returns. The returned
            summary alerts are therefore not printed a second time. listen
            is a loop of follow_chain passes with sleep(interval) between
            them (interval default 12); a code 3 stop ends the loop.
            KeyboardInterrupt anywhere in listen or backfill is a clean
            stop -- exit 0, no traceback, progress of the last complete
            block kept, the unfinished block resumed on the next start --
            and anywhere means the sleep, inside a pass (a transport call, a
            retry backoff), while the ALERT lines are being written, while
            the stop line is being written, and between a pass and the
            pause. recheck prints the alerts of recheck_watchlist(store,
            min_score=--min, 0.8 by default) over the whole database, one
            ALERT line each, in the order that function returns them, and
            exits 0 -- also with no seeds, no alerts or an empty database,
            where stdout stays empty. seed add, after a successful add_seed,
            prints the ALERT lines of recheck_watchlist(store,
            seed_addresses=[the new address]) at the fixed threshold 0.8:
            the copies of the new seed already in the database, which no
            listen or backfill will ever report again; its exit code stays
            0, and a seed add that fails still exits 2 with an empty
            stdout. Both write through the same ALERT sink as listen and
            backfill, make no rpc call of their own, and a second run on an
            unchanged database prints exactly the same bytes. report writes
            build_report(store, prefix) -- two files, <PREFIX>.html and
            <PREFIX>.json, PREFIX being --out, "ethsc-report" by default --
            and prints exactly two stdout records, the html path then the
            json path, one per line, in that order; stderr stays empty and
            the exit code is 0, also on an empty database. It is the one
            subcommand that needs matplotlib: with matplotlib absent it
            writes neither file, leaves stdout empty, prints one line on
            stderr naming matplotlib and exits 2 with no traceback. It makes
            no rpc call. risk is a filter, not an annotation: it prints one
            "<address>\t<flags>" record ONLY for a stored address whose code
            carries at least one risk flag. An address whose code has neither
            flag does not appear at all -- it is never printed with a "-", and
            an address stored without code is never printed either. The "-"
            placeholder belongs only to the fixed cluster and similar column;
            risk has no such placeholder, because a flagless address is simply
            absent. So on the 206-address base of block 26077729 (147 with
            code) risk prints 14 lines, not 147 (it was 34 before is_std_proxy
            dropped the standard proxies from mutable_delegatecall). The listing is sorted by
            address ascending; --flag NAME restricts it to the addresses whose
            code has that one flag and prints only that name in the <flags>
            field. risk reads flags with risk_flags over the code of each
            address, makes no rpc call, exits 0 -- also with an empty database,
            where stdout stays empty -- and two runs on an unchanged database
            print byte-identical stdout. Nothing printed ever contains the key.
            Data source (phase 10), on listen and backfill only. --source
            infura is the default and changes nothing: without rpc the client
            is RpcClient(infura_url()), follow_chain gets prices=PRICES,
            code_tag None and workers --workers (default 1). --source
            publicnode: without rpc the client is RpcClient(PUBLICNODE_URL,
            prices={}, max_retries=5) -- no key is read and infura_url() is
            not called, so it runs with INFURA_API_KEY unset and no .env --
            and follow_chain gets prices={}, code_tag "latest" and workers
            --workers (default 8), so the credit ledger of the day stays as it
            was. An rpc passed to main is used as is for either source; the
            source still decides prices, code_tag and the default workers.
            Usage errors, exit 2 with exactly one stderr line, empty stdout
            and no rpc call (no eth_blockNumber either): --daily-budget
            together with --source publicnode (the budget is an Infura
            credit budget; it is refused, never silently ignored), --workers
            below 1, and a --source outside {infura,publicnode}. There is no
            upper bound on --workers. --max-calls-per-block works for both
            sources, and a cap stop on the public node reports "spent 0
            credits" when the day's ledger holds nothing else. An RpcError
            out of follow_chain -- "eth_getBlockReceipts returned null" once
            the client's retries are exhausted included -- keeps its phase 5
            meaning for both sources and in listen too: exit 1, one stderr
            line, no traceback, progress at the last complete block. Known
            limitation, accepted 2026-09-30: with code_tag "latest" a contract
            that self-destructed after the block answers "0x" and is stored as
            an address without code, known from then on.
            Seed of a contract not in the base (phase 12). seed add takes
            --fetch. Without it nothing changes. With it the address is
            validated first (a bad address is exit 2 before any rpc); then,
            if store.has_address(address) is True, no client is built and no
            rpc call is made and seed add goes on exactly as without --fetch
            (so a known EOA still answers exit 2). Otherwise the client is the
            rpc passed to main, or else RpcClient(PUBLICNODE_URL, prices={},
            max_retries=5) -- infura_url() is never called and no key is read
            -- and exactly two calls are made, in this order:
            call("eth_blockNumber", []) and call("eth_getCode", [<address
            lowercase>, "latest"]); block is int(<eth_blockNumber answer>, 16).
            A code answer that is "0x" + a non-empty even run of hex digits is
            stored with put_code and put_address(address, code_id, block),
            then add_seed and the recheck alerts of the new seed are printed
            exactly as for a seed add of a stored address, exit 0. An answer
            "0x" (an EOA or a self-destructed contract) is stored with
            put_address(address, None, block), like the eoas of Ingest Block,
            and the command answers exit 2 with the one stderr line
            "unknown address or no code: <address>" and an empty stdout. Any
            other answer (null, odd length, not hex) is exit 1 with exactly
            one stderr line "eth_getCode returned no code: <address>" and
            nothing stored. An RpcError from either call is exit 1, stderr
            str(err) on one line, no traceback, nothing stored (not even an
            address row). --fetch never writes the credit ledger (spend is
            not called: the public node has no credits) and never reaches
            follow_chain. seed remove <address> validates the address
            (exit 2 on a bad one), calls store.remove_seed and makes no rpc
            call: True is exit 0 with stdout and stderr empty; False is exit 2
            with exactly one stderr line "not a seed: <address>" and an empty
            stdout. The code and address rows stay, so a later recheck no
            longer names the removed seed and a seed add without --fetch can
            restore it.
            Origin of an alert (phase 13). Every ALERT record carries a sixth
            field after the score, the origin of the alerted address: one of
            created, seen, fetched, unknown -- created when the address was
            the contractAddress of a receipt of the block that stored it,
            seen when it only came as a to or a log emitter, fetched when
            seed add --fetch stored it, unknown for a row stored before
            phase 13. Every path that prints alerts prints it the same way:
            listen, backfill, recheck, seed add (with and without --fetch).
            seed add --fetch stores the address it fetches -- the code
            answer and the "0x" answer alike -- with origin "fetched".
            listen and backfill take --alert-on {created,seen,all}, default
            all: a filter on the printed ALERT lines only -- with created
            (seen) only the lines whose origin is created (seen) are
            written, in the same order; the store writes, the progress, the
            exit code, the stop line and the alert list handed to on_alerts
            by follow_chain are exactly those of a run without the flag.
            recheck takes --origin {created,seen,fetched,unknown}, the same
            kind of filter over the recheck_watchlist alerts; without it
            every alert is printed. A value outside these sets is an
            argparse usage error: exit 2, one stderr line, empty stdout, no
            rpc call.
            Standard proxies (phase 14). listen and backfill hand
            follow_chain an on_upgrades sink that prints one record
            "UPGRADE\t<proxy>\t<old_impl>\t<new_impl>\t<block>" per upgrade
            of the block, after the block's ALERT lines, in the order
            follow_chain delivers them; --alert-on filters ALERT lines only,
            never UPGRADE lines. The ALERT origin field gains the value
            impl (the alerted address is an implementation stored on behalf
            of a proxy); --alert-on created (seen) hides impl lines like any
            other origin, all prints them; recheck --origin accepts impl.
            cluster, clusters top, similar and recheck see through the
            implementation as build_clusters, find_similar and
            recheck_watchlist do; a proxy's ALERT line is the proxy's
            address with the proxy's origin, and its score is its
            implementation's. seed add seeds through the implementation as
            add_seed does. seed add --fetch on an address the store does
            not hold makes, after eth_blockNumber and eth_getCode, when the
            code is a standard proxy, the slot read(s) and the
            implementation fetch of fetch_implementation with get_storage =
            rpc.call("eth_getStorageAt", [address, slot, "latest"]) and
            get_code over eth_getCode at "latest", the fetched address
            stored with origin "fetched" and its implementation with origin
            "impl"; then add_seed and the recheck of that seed as before. On
            an address the store already holds whose code is a standard proxy
            with NULL implementation, --fetch is no longer a no-op: it makes
            eth_blockNumber and the same fetch_implementation calls (no
            eth_getCode of the proxy itself), then seeds; on a held address
            with an implementation, or a held non-proxy, --fetch stays a
            no-op. A slot read that fails or reads zero leaves the seed on the
            proxy's own code: exit 0, the phase-9 behaviour, nothing on
            stderr. The number and order of rpc calls is part of the
            contract (examples 44-49).
            Dashboard (phase 15). listen and backfill go through
            follow_chain, which records every ALERT and UPGRADE it hands to
            the sinks as an event (see Follow Chain); the printed lines are
            unchanged and --alert-on filters stdout only, never the events.
            recheck and seed add write no events. `dashboard [--host H]
            [--port P] [--static DIR]` (defaults 127.0.0.1, 8080,
            "dashboard/dist") serves the dashboard of the --db file: it
            never opens a writable Store -- main branches to it before the
            Store(args.db) every other subcommand opens, so an old database
            is neither migrated nor switched to WAL by it. A --db path that
            is not an existing file: exit 2, one stderr line naming the
            path, no file created. Otherwise it calls
            ethsc.dashboard.make_server(db, host, port, static) -- through
            the module attribute, so a test patches
