version: 1
System:
  name: ethsc
  description: >
    ETHSmartChecker proof: indexes the runtime bytecode of Ethereum mainnet
    contracts seen in new blocks (Infura free tier or the keyless public node
    ethereum-rpc.publicnode.com, HTTPS polling), stores it
    in SQLite by content hash, and clusters it by code on three levels (L0
    identical code, L1 identical skeleton or proxy target, L2 selector or
    opcode similarity). Security aim: from one known scam or vulnerable
    contract, find its copies and near-copies, and alert when a new one
    appears. Package ethsc/, CLI python -m ethsc.
  requirements: [Stdlib Only, Offline Tests, Real Fixtures]
  guardrails: [Deterministic Output]
  groups:
    - name: evm
      description: >
        Pure bytecode analysis over runtime code given as bytes: disassembly,
        compiler-metadata stripping, dispatcher selectors, proxy detection,
        and the masked skeleton used for L1 clustering. No I/O.
      functions:
        - name: Disassemble
          description: >
            disassemble(code: bytes) -> list of (pc, op, arg) tuples, one per
            instruction, in code order: pc is the byte offset, op the opcode
            byte (int), arg the immediate bytes of PUSH1..PUSH32 (0x60..0x7f,
            n = op - 0x5f bytes) and b"" for every other opcode.
          behavior: >
            Every byte that is not a PUSH immediate is an instruction, including
            undefined opcodes (no name table, no validation). A PUSH whose
            immediate runs past the end of the code takes the bytes that are
            there (a shorter arg) and ends the list; nothing raises. Empty code
            gives []. PUSH0 (0x5f) has no immediate.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - produces: Instruction
          examples:
            - given: 'the bytes of tests/fixtures/code_weth9.hex (0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2, 3124 bytes)'
              when: 'disassemble is called'
              then: 'the first three instructions are (0, 0x60, b"\x60"), (2, 0x60, b"\x40"), (4, 0x52, b"")'
              ref: 'fixture bytes 0x6060604052; WETH9 is solc 0.4.19 (Sourcify)'
            - given: 'the 3081-byte body of code_weth9.hex (the code without its last 43 bytes)'
              when: 'disassemble is called'
              then: 'the list has 1555 instructions'
              ref: 'counted over the fixture'
            - given: 'the 4 bytes 0x600161ff (PUSH1 0x01, then PUSH2 with only one byte left)'
              when: 'disassemble is called'
              then: '[(0, 0x60, b"\x01"), (2, 0x61, b"\xff")] and no exception'
              ref: 'Tolerant Parser'
            - given: 'empty code b""'
              when: 'disassemble is called'
              then: 'the result is []'
              ref: 'Tolerant Parser'
        - name: Strip Metadata
          description: >
            strip_metadata(code: bytes) -> (body, trailer): splits off the
            solc CBOR metadata appended at the end of runtime code.
          behavior: >
            Let n be the big-endian value of the last 2 bytes. When
            len(code) >= 2, 0 < n <= len(code) - 2 and the byte at
            len(code) - 2 - n is a CBOR map header 0xa1..0xa5, the trailer is
            the last n + 2 bytes and the body is everything before it.
            Otherwise body is the whole code and trailer is b"". No CBOR
            decoding. Never raises.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
          examples:
            - given: 'code_weth9.hex (3124 bytes, ends 0x0029)'
              when: 'strip_metadata is called'
              then: 'body is 3081 bytes; trailer is 43 bytes and starts with a165627a7a72305820 (bzzr0)'
              ref: 'fixture bytes'
            - given: 'code_univ2_usdc_weth.hex (0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc, 11293 bytes, solc 0.5.16)'
              when: 'strip_metadata is called'
              then: 'body is 11241 bytes; trailer is 52 bytes, starts with a265627a7a72315820 and contains 64736f6c6343000510 (solc 0.5.16)'
              ref: 'fixture bytes; compiler version from Sourcify'
            - given: 'code_univ3_usdc_weth_005.hex (0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640, 22142 bytes, solc 0.7.6, bytecodeHash none)'
              when: 'strip_metadata is called'
              then: 'body is 22130 bytes and trailer is exactly a164736f6c6343000706000a (12 bytes)'
              ref: 'fixture bytes'
            - given: 'the 45-byte EIP-1167 clone code_clone_270df012.hex (last 2 bytes 0x5bf3) and empty code b""'
              when: 'strip_metadata is called on each'
              then: 'the clone comes back whole with trailer b""; empty code gives (b"", b"")'
              ref: 'Tolerant Parser'
        - name: Extract Selectors
          description: >
            extract_selectors(code: bytes) -> sorted list of distinct 4-byte
            function selectors of the dispatcher, each as "0x" + 8 lowercase
            hex digits.
          behavior: >
            Disassemble the body from strip_metadata. A selector is the arg of
            a PUSH4 (0x63) instruction with a 4-byte arg when one of the next
            two instructions is EQ (0x14); this covers both the
            DUP1 PUSH4 s EQ and the PUSH4 s DUP2 EQ dispatcher shapes and
            skips the PUSH4 used by GT/LT binary-search splits and by masks.
            Code with no dispatcher gives [].
          guardrails: [Tolerant Parser]
          steps:
            - calls: Disassemble
            - calls: Strip Metadata
          examples:
            - given: 'code_weth9.hex'
              when: 'extract_selectors is called'
              then: >
                exactly the 11 published WETH9 selectors: 0x06fdde03,
                0x095ea7b3, 0x18160ddd, 0x23b872dd, 0x2e1a7d4d, 0x313ce567,
                0x70a08231, 0x95d89b41, 0xa9059cbb, 0xd0e30db0, 0xdd62ed3e
              ref: 'WETH9 ABI (Sourcify exact match, tests/fixtures/abi_weth9.sourcify.json, 11 functions)'
            - given: 'code_usdt.hex (0xdAC17F958D2ee523a2206206994597C13D831ec7)'
              when: 'extract_selectors is called'
              then: >
                exactly 32 selectors: 0x06fdde03, 0x0753c30c, 0x095ea7b3,
                0x0e136b19, 0x0ecb93c0, 0x18160ddd, 0x23b872dd, 0x26976e3f,
                0x27e235e3, 0x313ce567, 0x35390714, 0x3eaaf86b, 0x3f4ba83a,
                0x59bf1abe, 0x5c658165, 0x5c975abb, 0x70a08231, 0x8456cb59,
                0x893d20e8, 0x8da5cb5b, 0x95d89b41, 0xa9059cbb, 0xc0324c77,
                0xcc872b66, 0xdb006a75, 0xdd62ed3e, 0xdd644f72, 0xe47d6060,
                0xe4997dc5, 0xe5b5019a, 0xf2fde38b, 0xf3bdc228
              ref: 'TetherToken ABI (Sourcify match, tests/fixtures/abi_usdt.sourcify.json, 32 functions)'
            - given: 'code_univ2_usdc_weth.hex (solc 0.5.16, dispatcher with GT splits)'
              when: 'extract_selectors is called'
              then: '27 selectors, including 0x022c0d9f (swap) and 0x0902f1ac (getReserves)'
              ref: 'UniswapV2Pair ABI (Sourcify match, tests/fixtures/abi_univ2_pair.sourcify.json, 27 functions)'
            - given: 'code_belle.hex (the BELLE honeypot token)'
              when: 'extract_selectors is called'
              then: '14 selectors, including 0xf7e58a63 (Blacklist(address,bool)) and 0x78051f4d (RenounceOwnership(address))'
              ref: 'BELLE ABI (Sourcify exact match, tests/fixtures/abi_belle.sourcify.json, 14 functions)'
            - given: 'the EIP-1167 clone code_clone_270df012.hex, then empty code b""'
              when: 'extract_selectors is called on each'
              then: 'both give []'
              ref: 'Tolerant Parser'
        - name: Detect Proxy
          description: >
            detect_proxy(code: bytes) -> {"kind": "eip1167" | "eip7702",
            "target": "0x" + 40 lowercase hex} or None: recognizes the exact
            EIP-1167 minimal proxy runtime and the EIP-7702 delegation
            designator, and returns the implementation (or delegate) address.
          behavior: >
            eip1167: exactly 45 bytes, 363d3d373d3d3d363d73 + 20 address bytes
            + 5af43d82803e903d91602b57fd5bf3. eip7702: exactly 23 bytes,
            ef0100 + 20 address bytes. Anything else, including a truncated
            clone and the shortened vanity-address variants of EIP-1167,
            gives None.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - produces: Proxy Info
          examples:
            - given: 'code_clone_270df012.hex and code_clone_3b2fac8e.hex (two clones seen in block 26077729)'
              when: 'detect_proxy is called on each'
              then: 'both give {"kind": "eip1167", "target": "0x4181f37093e3a21a4e0d5ef355c5b1938cba5bfb"}'
              ref: 'target read from the clone bytes 10..30; the target is HolderDistributor, Sourcify exact match'
            - given: 'code_clone_2ca7b61b.hex'
              when: 'detect_proxy is called'
              then: 'target is "0x8b72b9b8e544f944cdcdf0cdb6194f917ac1eba5" (kind eip1167), a different implementation'
              ref: 'clone bytes; target is LaunchToken, Sourcify exact match'
            - given: 'code_7702_04cfab85.hex (23 bytes, the code of the delegated EOA 0x04cfab854b82159745eead5ed4ad148645e1173b)'
              when: 'detect_proxy is called'
              then: '{"kind": "eip7702", "target": "0x0000fb7702036ff9f76044a501ac1aa74cbab16b"}'
              ref: 'fixture bytes ef0100 + target; EIP-7702 designator format'
            - given: 'the first 44 bytes of code_clone_270df012.hex, code_weth9.hex, and empty code b""'
              when: 'detect_proxy is called on each'
              then: 'all three give None'
              ref: 'Tolerant Parser'
        - name: Standard Proxy
          description: >
            is_std_proxy(code: bytes) -> bool: True when the code is a
            standard, audited upgradeable proxy -- EIP-1967 transparent,
            UUPS, or Beacon -- whose implementation address is read from a
            well-known constant storage slot. Recognized purely from the
            bytecode, no storage read (eth_getStorageAt is out of scope).
          behavior: >
            True when a PUSH32 immediate of the disassembled body from
            strip_metadata equals one of the audited slot constants: the
            EIP-1967 (and UUPS) implementation slot
            0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
            (keccak256("eip1967.proxy.implementation") - 1), or the EIP-1967
            beacon slot
            0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50
            (keccak256("eip1967.proxy.beacon") - 1). The constant must appear
            as a real PUSH32 immediate, not as a substring of the raw bytes,
            so a coincidental byte run or a metadata trailer never counts.
            Never raises: is_std_proxy(b"") is False.
          guardrails: [Tolerant Parser]
          steps:
            - calls: Disassemble
            - calls: Strip Metadata
          examples:
            - given: 'code_proxy_seed_0c010533.hex (the TransparentUpgradeableProxy seed of the live 30.09 base, 2059 bytes)'
              when: 'is_std_proxy is called'
              then: 'True; the EIP-1967 implementation slot appears as a PUSH32 immediate'
              ref: 'the seed 0x0c0105334a50db16b51b2911c9956539753a2cf8; keccak of "eip1967.proxy.implementation" - 1'
            - given: 'code_proxy_046eee2c.hex (a second, distinct standard proxy from the live base, 2227 bytes)'
              when: 'is_std_proxy is called'
              then: 'True'
              ref: '0x046eee2cc3188071c02bfc1745a6b17c656e3f3d; different bytecode, same audited slot'
            - given: 'a constructed body PUSH32 <beacon slot> then SLOAD then DELEGATECALL (0x7f + 32 bytes of the beacon slot + 0x54 0xf4)'
              when: 'is_std_proxy is called'
              then: 'True -- the beacon slot is recognized as well'
              ref: 'EIP-1967 beacon slot constant'
            - given: 'code_weth9.hex, the EIP-1167 clone code_clone_270df012.hex, and empty code b""'
              when: 'is_std_proxy is called on each'
              then: 'all three False -- no audited slot immediate, and an eip1167 clone bakes its target into the code, not a slot'
              ref: 'neither carries an EIP-1967/UUPS/Beacon slot constant'
        - name: Build Skeleton
          description: >
            build_skeleton(code: bytes) -> bytes: the body from strip_metadata
            re-serialized instruction by instruction with the immediates of
            PUSH20 (0x73) and PUSH32 (0x7f) replaced by zero bytes of the same
            length; every other byte kept.
          behavior: >
            Masks what differs between deployments of one source: constructor
            immutables (always PUSH32 in solc) and hardcoded addresses
            (PUSH20). The length equals the body length. A truncated PUSH20 or
            PUSH32 masks only the bytes present. Same compiler output with a
            different metadata trailer gives the same skeleton.
          guardrails: [Tolerant Parser]
          steps:
            - calls: Disassemble
            - calls: Strip Metadata
          examples:
            - given: >
                code_univ3_usdc_weth_005.hex (0x88e6A0c2...) and
                code_univ3_pool_e0554a47.hex (0xe0554a476a092703abdb3ef35c80e0d76d32939f),
                two UniswapV3Pool deployments (Sourcify match) of 22142 bytes each
              when: 'build_skeleton is called on each'
              then: 'the raw codes differ in 74 bytes, all inside PUSH32 immediates, and the two skeletons are equal'
              ref: 'byte diff of the two fixtures'
            - given: >
                code_launchtoken_4e67db19.hex and code_launchtoken_40676634.hex,
                two LaunchToken deployments (Sourcify exact match for 0x4e67db19...) of 2383 bytes each
              when: 'build_skeleton is called on each'
              then: 'the raw codes differ in 58 bytes inside 3 PUSH32 immediates, and the two skeletons are equal'
              ref: 'byte diff of the two fixtures'
            - given: 'code_weth9.hex, and a copy of it with one byte of the metadata trailer flipped (byte -5 xor 0xff)'
              when: 'build_skeleton is called on each'
              then: 'both skeletons are equal and each is 3081 bytes long'
              ref: 'fixture bytes'
            - given: 'code_weth9.hex and code_usdt.hex'
              when: 'build_skeleton is called on each'
              then: 'the skeletons differ'
        - name: Flag Risk
          description: >
            risk_flags(code: bytes) -> {"selfdestruct": bool,
            "mutable_delegatecall": bool}: two per-code security flags read
            from the runtime bytecode alone -- no source, no data-flow, no
            control-flow graph.
          behavior: >
            Both flags are read from the disassembly of the body from
            strip_metadata, so a 0xFF or 0xF4 byte inside a PUSH immediate or
            inside the metadata trailer never counts. selfdestruct is True when
            an opcode SELFDESTRUCT (0xFF) appears in that body: it marks the
            opcode present as an executable instruction, not a proof that some
            path reaches it (there is no CFG here, only disassembly).
            mutable_delegatecall is True when four conditions hold together:
            an opcode DELEGATECALL (0xF4) appears in the body, detect_proxy(code)
            is not "eip1167" (an EIP-1167 clone bakes its implementation address
            into the code and is excluded, however it is reached), an opcode
            SLOAD (0x54) appears in the body -- the cheap syntactic stand-in,
            since data-flow is out of scope, for an implementation address that
            comes from storage rather than hardcoded -- and is_std_proxy(code)
            is False: a standard EIP-1967/UUPS/Beacon proxy reads its
            implementation from an audited, well-known slot and is upgradeable
            by design, not a suspicious mutable delegatecall, so it is excluded
            even though it has DELEGATECALL and SLOAD. Order and position of the
            opcodes do not matter, only their presence. Never raises on empty or
            garbage bytes: risk_flags(b"") is both False.
          guardrails: [Tolerant Parser]
          steps:
            - reads: Runtime Code
            - calls: Disassemble
            - calls: Strip Metadata
            - calls: Detect Proxy
            - calls: Standard Proxy
            - produces: Risk Flags
          examples:
            - given: 'code_weth9.hex'
              when: 'risk_flags is called'
              then: 'both flags are False'
              ref: 'no SELFDESTRUCT and no DELEGATECALL opcode in the WETH9 body'
            - given: 'the EIP-1167 clone code_clone_270df012.hex (one DELEGATECALL, target baked as a PUSH20 immediate)'
              when: 'risk_flags is called'
              then: 'both flags are False -- an eip1167 clone is never mutable_delegatecall'
              ref: 'detect_proxy is eip1167; Detect Proxy example 1'
            - given: 'the single byte b"\xff", then the two bytes b"\x60\xff" (PUSH1 0xff)'
              when: 'risk_flags is called on each'
              then: 'selfdestruct is True for b"\xff" and False for b"\x60\xff"; both mutable_delegatecall False'
              ref: 'Tolerant Parser: 0xff as an opcode versus 0xff as PUSH data'
            - given: 'code_proxy_seed_0c010533.hex (a standard EIP-1967 proxy: DELEGATECALL and SLOAD present, is_std_proxy True)'
              when: 'risk_flags is called'
              then: 'both flags False -- a standard upgradeable proxy is not mutable_delegatecall, though it delegatecalls to a storage-loaded implementation'
              ref: 'is_std_proxy excludes the audited EIP-1967/UUPS/Beacon slot; the false positive found on the live 30.09 base'
            - given: 'a store filled from codes_26077729.json, risk_flags read over every distinct code'
              when: 'the codes with each flag are counted'
              then: >
                exactly 1 code has selfdestruct (address
                0xfeeeeee44046c3f61a8cc081e0918ef0de0a7ffc) and 12 codes have
                mutable_delegatecall (over 13 addresses); no code has both
              ref: 'counted over codes_26077729.json after excluding standard proxies (17 std proxies in the block), 2026-09-30; was 29 codes / 33 addresses before is_std_proxy'
            - given: 'empty code b""'
              when: 'risk_flags is called'
              then: 'both flags are False and nothing raises'
              ref: 'Tolerant Parser'
      dataObjects:
        - name: Runtime Code
          description: >
            Deployed runtime bytecode as bytes, decoded from the hex string of
            eth_getCode ("0x" + hex). Fixtures tests/fixtures/code_*.hex hold
            that string verbatim, no trailing newline; decode with
            bytes.fromhex(text.strip()[2:]). "0x" is an account with no code.
          schema: bytes
        - name: Instruction
          description: One disassembled instruction.
          schema:
            pc: int, byte offset in the code
            op: int, opcode byte 0..255
            arg: bytes, PUSH immediate (possibly short at the end), else b""
        - name: Proxy Info
          description: What a proxy or delegation points to.
          schema:
            kind: '"eip1167" or "eip7702"'
            target: '"0x" + 40 lowercase hex'
        - name: Risk Flags
          description: >
            The two per-code security flags risk_flags reads from bytecode,
            in this fixed key order.
          schema:
            selfdestruct: 'bool -- a SELFDESTRUCT (0xFF) opcode in the stripped body'
            mutable_delegatecall: 'bool -- a DELEGATECALL (0xF4) opcode in a non-eip1167, non-standard-proxy code whose body also has SLOAD (0x54); a standard EIP-1967/UUPS/Beacon proxy (is_std_proxy) is excluded'
    - name: fingerprint
      description: >
        One fingerprint per distinct code, and the L2 similarity between two
        codes. Pure functions over bytes; calls evm.
      functions:
        - name: Fingerprint Code
          description: >
            fingerprint(code: bytes) -> Fingerprint dict or None for empty
            code: code_id (sha256 hex of the raw code), size, skeleton_hash
            (sha256 hex of build_skeleton), selectors (extract_selectors),
            proxy (detect_proxy), std_proxy (is_std_proxy, a bool; phase 11).
          behavior: >
            code_id is sha256, not keccak: stdlib has no keccak and the
            clustering does not need the chain's codeHash. Never raises on
            garbage bytes. std_proxy is the one input of the Similarity Score
            rules that selectors and proxy do not already carry; it is in the
            dict so that two stored fingerprints can be scored without their
            code (phase 11).
          guardrails: [Tolerant Parser]
          steps:
            - uses: evm
            - produces: Fingerprint
          examples:
            - given: 'code_univ2_usdc_weth.hex and code_univ2_weth_usdt.hex (0x0d4a11d5EEaaC28EC3F61d100daF4d40471f1852)'
              when: 'fingerprint is called on each'
              then: 'both code_id are 8b5db55fa9ab3b9527508d4abe0b39eb588bf310270c8e04b3f38214e8ba63b4, size 11293, 27 selectors'
              ref: 'the two fixtures are byte-identical (cmp); sha256sum of the decoded bytes'
            - given: 'code_weth9.hex'
              when: 'fingerprint is called'
              then: 'code_id is 5566bf50796faf93c9b6f6adacd3b32c70bfe16b48ffc59db6cd144cbdc89739, size 3124, proxy None'
              ref: 'sha256 of the decoded fixture bytes'
            - given: 'code_univ3_usdc_weth_005.hex and code_univ3_pool_e0554a47.hex'
              when: 'fingerprint is called on each'
              then: 'code_id differ, skeleton_hash are equal'
              ref: 'Build Skeleton example 1'
            - given: 'empty code b""'
              when: 'fingerprint is called'
              then: 'the result is None'
              ref: 'Tolerant Parser'
            - given: 'code_proxy_seed_0c010533.hex, code_proxy_046eee2c.hex and code_weth9.hex'
              when: 'fingerprint is called on each'
              then: 'std_proxy is True, True and False; the dict has exactly the six keys code_id, size, skeleton_hash, selectors, proxy, std_proxy'
              ref: 'is_std_proxy on the fixtures (phase 11)'
        - name: Score Fingerprints
          description: >
            score_fingerprints(fp_a, fp_b) -> float in [0, 1]: the Similarity
            Score of two codes computed from their Fingerprint dicts alone,
            without their bytes. Each argument is a Fingerprint dict (as
            fingerprint() or Store.fingerprints() gives it) or None (the
            fingerprint of empty code).
          behavior: >
            The same three rules as Similarity Score, in the same order, each
            read from the dict: (1) proxy -- if either proxy is not None, 1.0
            when both are not None with equal kind AND equal target, else 0.0;
            (2) otherwise 0.0 if either std_proxy is true or either selectors
            list is empty; (3) otherwise the Jaccard index of the two selector
            sets, float(len(intersection)) / float(len(union)), never rounded.
            None on either side scores 0.0 (it has no proxy, no std_proxy and
            no selectors, so rule (2) applies). Rule (2) reads the key
            std_proxy of the dict, never the code. Symmetric; never raises on
            two dicts of the Fingerprint schema or None. For every pair of
            codes a, b: score_fingerprints(fingerprint(a), fingerprint(b)) ==
            similarity(a, b), the same float.
          steps:
            - uses: Fingerprint
          examples:
            - given: 'fingerprint(code_belle.hex) and fingerprint(code_belle_copy_1807090d.hex)'
              when: 'score_fingerprints is called'
              then: '13/15 (0.8666666666666667), equal to similarity of the two codes'
              ref: 'Similarity Score example 3'
            - given: 'fingerprint(code_proxy_seed_0c010533.hex) against fingerprint(code_proxy_046eee2c.hex), and against fingerprint(code_weth9.hex)'
              when: 'score_fingerprints is called'
              then: '0.0 both times'
              ref: 'rule (2); Similarity Score examples 6 and 7'
            - given: 'fingerprint(code_weth9.hex) against a copy of it with std_proxy set to True; and fingerprint(code_proxy_seed_0c010533.hex) against a copy of itself with std_proxy set to False on both sides'
              when: 'score_fingerprints is called'
              then: '0.0 for the first (rule 2 reads the dict); 1.0 for the second (5 equal admin selectors, rule 3)'
              ref: 'the seed proxy has 5 selectors, fixtures README'
            - given: 'None against fingerprint(code_weth9.hex), fingerprint(code_weth9.hex) against None, and None against None'
              when: 'score_fingerprints is called'
              then: '0.0 all three times'
              ref: 'similarity(b"", code) == 0.0'
            - given: 'the 20 fixtures tests/fixtures/code_*.hex (19 of phase 11 plus code_impl_72b97171.hex of phase 14)'
              when: 'score_fingerprints(fingerprint(a), fingerprint(b)) and similarity(a, b) are called for all 400 ordered pairs (a, b), a == b included'
              then: 'the two floats are equal (==) on all 400 pairs'
              ref: 'on the live 30.09 base: 15018 recheck pairs, 0 mismatches (measured 30.09); 361 pairs of 19 fixtures until phase 14'
        - name: Similarity Score
          description: >
            similarity(code_a: bytes, code_b: bytes) -> float in [0, 1]: a
            comparison that means something only when there is a real surface
            to compare. When neither code is an opaque proxy, it is the
            Jaccard index of the two selector sets. Recognized delegations
            (EIP-1167 clones, EIP-7702 designators) and opaque codes are
            compared by identity, not by shape: two proxies never look alike
            just because their proxy bytecode is boilerplate.
          behavior: >
            The rule, in order:
            (1) if either code is a recognized delegation (detect_proxy not
            None), the score is 1.0 when both are the same detect_proxy kind
            AND target, else 0.0 -- a clone or a 7702 designator matches only
            the same implementation/target, never any other proxy;
            (2) otherwise, if either code is a standard upgradeable proxy
            (is_std_proxy) or either selector set is empty, the score is 0.0 --
            an opaque proxy or a selector-less code carries no distinguishing
            surface, and its implementation lives in storage we do not read
            (eth_getStorageAt is out of scope), so two of them must not score
            1.0;
            (3) otherwise the Jaccard index of the two non-empty selector sets.
            Symmetric; similarity(b"", b"") == 0.0; no exception on empty or
            garbage bytes. Two codes with the same non-empty selector set score
            1.0; the score is the float of the division, never rounded: 13/15,
            26/32, 9/16 compare exactly downstream. The opcode-3gram fallback of
            earlier phases is gone: on the live 30.09 base it made every
            selector-poor proxy match the TransparentUpgradeableProxy seed
            (380 of 572 recheck alerts at 1.0), all false.
            Since phase 11 similarity(code_a, code_b) keeps this signature and
            this contract and is computed as score_fingerprints(fingerprint(
            code_a), fingerprint(code_b)): the rules live in one place.
          steps:
            - uses: evm
          examples:
            - given: 'code_weth9.hex (11 selectors) and code_usdt.hex (32 selectors)'
              when: 'similarity is called'
              then: '9/34 (0.2647 to 4 places); the 9 shared are the ERC-20 core name..allowance'
              ref: 'selector lists above, hand count'
            - given: 'code_univ2_usdc_weth.hex (27) and code_weth9.hex (11)'
              when: 'similarity is called'
              then: '9/29 (0.3103 to 4 places)'
              ref: 'hand count'
            - given: 'code_belle.hex and code_belle_copy_1807090d.hex (ALPHA, same deployer, Sourcify exact match)'
              when: 'similarity is called'
              then: '13/15 (0.8667 to 4 places); the copy has 0x8f5db675 BotBlacklist(address,bool) instead of 0xf7e58a63 Blacklist(address,bool)'
              ref: 'selector diff of the fixtures; keccak of the two signatures'
            - given: 'code_clone_270df012.hex and code_clone_2ca7b61b.hex (both EIP-1167 clones, no selectors, different targets)'
              when: 'similarity is called'
              then: '0.0 -- different targets, so different implementations, however alike the 45-byte proxy bytecode is'
              ref: 'rule (1); was 1.0 by opcode 3-grams before this phase, a false positive'
            - given: 'code_clone_270df012.hex against itself (same EIP-1167 target)'
              when: 'similarity is called'
              then: '1.0 -- same kind and same target'
              ref: 'rule (1)'
            - given: 'code_proxy_seed_0c010533.hex and code_proxy_046eee2c.hex (two distinct standard EIP-1967 proxies of the live base)'
              when: 'similarity is called'
              then: '0.0 -- both opaque standard proxies, no comparable surface; a standard proxy never matches another'
              ref: 'rule (2), is_std_proxy True on both; the 380-alert false positive of the live 30.09 base'
            - given: 'code_proxy_seed_0c010533.hex (a standard proxy) and code_weth9.hex (a real contract with 11 selectors)'
              when: 'similarity is called'
              then: '0.0 -- one side is an opaque standard proxy'
              ref: 'rule (2)'
      dataObjects:
        - name: Fingerprint
          description: The analysed identity of one distinct code.
          schema:
            code_id: sha256 hex of the raw code (64 chars)
            size: int, bytes
            skeleton_hash: sha256 hex of build_skeleton(code)
            selectors: sorted list of "0x…" 8-hex strings
            proxy: Proxy Info or None
            std_proxy: bool, is_std_proxy(code) (phase 11)
    - name: store
      description: >
        SQLite persistence: distinct codes with their fingerprints, addresses
        pointing at codes, the follow progress, the security watchlist, and
        the daily credit ledger. One file, stdlib sqlite3.
      functions:
        - name: Store Codes And Contracts
          description: >
            Store(path) opens or creates the database (CREATE TABLE IF NOT
            EXISTS). put_code(code) -> code_id stores the code and its
            Fingerprint once per code_id; put_address(address, code_id, block)
            records an address (code_id None for an account without code);
            has_address(address) -> bool; code_of(address) -> bytes or None;
            addresses_of(code_id) -> sorted list. Bulk reads for cluster:
            fingerprints() -> list of Fingerprint dicts, one per row of codes,
            sorted by code_id; code_by_id(code_id) -> bytes or None for an
            unknown code_id. close() closes the connection. Phase 11: the
            schema holds the index addresses_code_id on addresses(code_id),
            and the codes table the column std_proxy INTEGER (0 or 1), written
            by put_code from fingerprint(code)["std_proxy"]. Phase 13: the
            addresses table holds the column origin TEXT;
            put_address(address, code_id, block, origin=None) stores it
            (None is stored as NULL); origins() -> dict, the bulk read for
            cluster: every stored address (lowercase) mapped to its origin,
            a NULL origin read back as "unknown". Phase 14: the addresses
            table holds the column implementation TEXT;
            set_implementation(address, implementation) writes it on a
            stored row; implementation(address) -> str or None reads it;
            implementations() -> dict is the bulk read for ingest and
            cluster: every stored address whose code has std_proxy 1,
            mapped to {"implementation": str or None, "code_id": str or
            None}, where code_id is the code_id stored for the
            implementation address (None when the implementation is
            unknown, not stored, or stored without code).
          behavior: >
            Addresses are lowercased on the way in: every method accepts an
            address in any case and stores or looks it up lowercase. Every
            write is committed before the method returns. put_code on a known
            code_id and put_address on a known address change nothing and do
            not raise. Every list the store returns is sorted. Each element of
            fingerprints() equals fingerprint(code) of that code, with exactly
            the keys code_id, size, skeleton_hash, selectors (a list, from
            json.loads of the stored text), proxy ({kind, target} or None
            when proxy_kind is NULL) and std_proxy (a bool, from the stored
            column); an empty database gives []. Other
            modules read the store only through these methods, never through
            its SQLite connection.
            Opening a database migrates it in place, once, with no flag: the
            index is created by CREATE INDEX IF NOT EXISTS in the schema
            script (after the addresses table); a codes table without the
            column std_proxy gets ALTER TABLE codes ADD COLUMN std_proxy
            INTEGER, so the column is the last one, after code, in a fresh
            and in a migrated database alike; then every row whose std_proxy
            IS NULL is filled with is_std_proxy of its stored code and
            committed. The NULL fill runs on every open, not only after the
            ALTER: a process killed between the ALTER and the fill, or a row
            written by an older ethsc, is repaired on the next open instead of
            scoring as a non-proxy forever. On the live 30.09 base (7509
            codes, 48413 addresses) the first open takes about 9 s (the fill),
            every later open well under 1 s; addresses_of went from a scan of
            48413 rows to an index lookup (build_clusters 200 s -> 0.12 s,
            measured 30.09).
            Origin (phase 13): a fresh database creates addresses with the
            columns address, code_id, block, origin in that order; an
            addresses table without origin gets ALTER TABLE addresses ADD
            COLUMN origin TEXT on open, once, so the column is last in a
            fresh and a migrated database alike. Existing rows are not
            rewritten: their origin stays NULL in the file and reads back
            as "unknown" through origins() (the live base has tens of
            thousands of rows; no UPDATE on open). put_address on a known
            address changes nothing, its origin included -- the first record
            wins. The values the code writes are "created", "seen" (ingest)
            and "fetched" (seed add --fetch); the store does not validate
            the text. origins() is one SELECT over addresses, an empty
            database gives {}.
            Implementation (phase 14): a fresh database creates addresses
            with the columns address, code_id, block, origin, implementation
            in that order; an addresses table without implementation gets
            ALTER TABLE addresses ADD COLUMN implementation TEXT on open,
            once, so the column is last in a fresh and a migrated database
            alike; existing rows are not rewritten (NULL stays in the file;
            no UPDATE on open). set_implementation(address, implementation)
            is the one write that changes a stored row: UPDATE addresses SET
            implementation = ? WHERE address = ?, both values lowercased,
            committed; on an address the store does not hold it changes
            nothing and does not raise; a later call overwrites (the
            upgrade case). The column carries the address the proxy
            delegates through -- the implementation of an EIP-1967/UUPS
            proxy or the beacon of a beacon proxy -- exactly as the caller
            gives it; the store never reads a slot and never decides what
            the value means. implementation(address) returns the stored
            text or None (unknown address, NULL, or an address whose code
            is not a standard proxy -- the column is written for standard
            proxies only, but the reader does not check that).
            implementations() is one SELECT joining addresses with codes
            (std_proxy = 1) and, by implementation, with addresses again
            for the implementation's code_id; an address without code, or
            whose code is not a standard proxy, is absent from it; an empty
            database gives {}. On the live 01.10 copy (210952 addresses,
            19574 codes, 1907 of them std_proxy, 5092 std-proxy addresses)
            the first open adds the column with no rewrite and
            implementations() stays well under 1 s.
            Phase 14 also changes add_seed: see Manage Watchlist.
            Phase 15 (the dashboard): Store(path, readonly=False). A
            writable open also creates the table events (see Record
            Events) by CREATE TABLE IF NOT EXISTS in the schema script,
            adds the column updated_at TEXT to a progress table that lacks
            it (ALTER TABLE progress ADD COLUMN updated_at TEXT, once, last
            column, old rows not rewritten -- see Track Progress), and
            switches the file to PRAGMA journal_mode=WAL. WAL is persistent
            in the file: a reader then never blocks the listener's writes
            and the listener never blocks a reader. The pragma is the first
            statement after connect; an already-WAL file is left as it is.
            Store(path, readonly=True) is a different open: see Open Read
            Only. The Store(path) signature with one positional argument is
            unchanged for every existing caller.
          guardrails: [No Network In Core, Deterministic Output]
          steps:
            - uses: fingerprint
            - modifies: Code Database
          examples:
            - given: >
                a fresh temp db and the four addresses of block 26077729 whose
                code in tests/fixtures/codes_26077729.json has code_id 8b5db55f…
                (0x22052a1a…, 0x2621cc0b…, 0x3041cbd3…, 0xb4e16d01…, all UniswapV2Pair)
              when: 'put_code and put_address are called for each'
              then: 'the codes table has 1 row, the addresses table 4 rows, addresses_of returns the 4 addresses sorted'
              ref: 'counted over codes_26077729.json'
            - given: 'an address stored with code_id None (an EOA, eth_getCode "0x")'
              when: 'has_address and code_of are called'
              then: 'has_address is True and code_of is None'
            - given: 'the db file closed and reopened'
              when: 'addresses_of is called'
              then: 'the same 4 addresses come back'
            - given: 'a fresh temp db, then code_weth9.hex, code_clone_270df012.hex and code_belle.hex put in that order'
              when: 'fingerprints() is called before and after, then code_by_id for each code_id and for an unknown id'
              then: '[] before; after, the three fingerprint(code) dicts sorted by code_id; code_by_id gives back the exact bytes, and None for the unknown id'
              ref: 'store-read acceptance of phase 3'
            - given: 'a store filled from codes_26077729.json'
              when: 'fingerprints() is called'
              then: '130 fingerprints, 12 of them with proxy not None'
              ref: 'counted over codes_26077729.json (store-read acceptance of phase 3)'
            - given: 'a fresh temp db'
              when: 'PRAGMA table_info(codes) and PRAGMA index_list(addresses) are read'
              then: 'the columns are code_id, size, skeleton_hash, selectors, proxy_kind, proxy_target, code, std_proxy in that order; addresses has an index named addresses_code_id on the one column code_id'
              ref: 'phase 11 schema'
            - given: 'a store filled from codes_26077729.json'
              when: 'fingerprints() is called'
              then: '130 fingerprints, 17 of them with std_proxy True; each equals fingerprint(code) of its stored code, all six keys'
              ref: 'is_std_proxy counted over the 130 distinct codes of codes_26077729.json (phase 11)'
            - given: >
                a phase-10 database: a file made with the phase-10 schema (codes
                with the seven columns code_id .. code, no std_proxy, no index
                on addresses) holding the 130 codes and 147 addresses with code
                of codes_26077729.json, written by plain INSERTs
              when: 'Store(path) opens it, and fingerprints() is called; then the same codes go through put_code into a fresh db'
              then: >
                after the open the codes table has the column std_proxy last
                and addresses the index addresses_code_id; fingerprints() of
                the migrated db equals fingerprints() of the fresh db, 130
                dicts, 17 with std_proxy True; no row has std_proxy NULL
              ref: 'phase 11 migration; on the live 30.09 copy: 7509 codes, 864 std_proxy True'
            - given: 'a phase-11 db of the 130 codes whose std_proxy was set back to NULL on every row (a fill interrupted after the ALTER)'
              when: 'the db is reopened with Store(path) and fingerprints() is called'
              then: 'no row has std_proxy NULL and fingerprints() equals that of a fresh db of the same codes'
              ref: 'the NULL fill runs on every open (phase 11)'
            - given: 'a fresh temp db'
              when: 'PRAGMA table_info(addresses) is read, and origins() is called'
              then: 'the columns are address, code_id, block, origin, implementation in that order; origins() is {}'
              ref: 'phase 13 schema; phase 14 appends implementation'
            - given: 'a fresh temp db and the code_id c of code_belle.hex'
              when: >
                put_address("0x1807090DD15A6F58E00FD769E32EBF20EE610385", c, 1, origin="created"),
                put_address("0x023697eda1dfbe331c2cf791ef2f6089e73e3230", None, 1, origin="seen"),
                put_address("0x34c6211621f2763c60eb007dc2ae91090a2d22f6", c, 1),
                then put_address("0x1807090dd15a6f58e00fd769e32ebf20ee610385", c, 2, origin="seen"),
                and origins() is called; then the db is reopened and origins() is called again
              then: >
                both times {"0x023697eda1dfbe331c2cf791ef2f6089e73e3230": "seen",
                "0x1807090dd15a6f58e00fd769e32ebf20ee610385": "created",
                "0x34c6211621f2763c60eb007dc2ae91090a2d22f6": "unknown"}; the
                second put_address on 0x1807… changed nothing (the row keeps
                block 1 and origin "created")
              ref: 'phase 13; first record wins'
            - given: >
                a phase-12 database: a file made with the phase-12 schema
                (addresses with the three columns address, code_id, block, no
                origin) holding the 130 codes and the 206 addresses of
                codes_26077729.json (59 with code_id NULL), written by plain
                INSERTs
              when: 'Store(path) opens it, origins() is called, the db is closed and opened again'
              then: >
                after the first open addresses has the columns origin and
                implementation after block, in that order (phase 14: origin is
                no longer last); origins() has 206 entries, every one
                "unknown"; the file still holds 206 rows with origin NULL
                (SELECT count(*) WHERE origin IS NULL is 206: nothing
                rewritten); has_address and addresses_of answer as before; the
                second open adds no column and changes nothing
              ref: 'phase 13 migration; on the live 30.09 copy: 48413 rows, all unknown'
            - given: 'a fresh temp db'
              when: 'PRAGMA table_info(addresses) is read, and implementations() is called'
              then: 'the columns are address, code_id, block, origin, implementation in that order; implementations() is {}'
              ref: 'phase 14 schema'
            - given: >
                a fresh temp db holding code_proxy_seed_0c010533.hex at
                0x0c0105334a50db16b51b2911c9956539753a2cf8 (block 1, origin
                "fetched") and at 0x069c4c579671f8c120b1327a73217d01ea2ec5ea
                (block 1, origin "seen"), code_impl_72b97171.hex at
                0x72b971717e088b59f26d4236be222adb6acd393b (block 1, origin
                "impl") and code_weth9.hex at
                0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2 (block 1)
              when: >
                implementations() is called; then
                set_implementation("0x0C0105334A50DB16B51B2911C9956539753A2CF8",
                "0x72B971717E088B59F26D4236BE222ADB6ACD393B"),
                set_implementation("0x069c4c579671f8c120b1327a73217d01ea2ec5ea",
                "0x1111111111111111111111111111111111111111") and
                set_implementation("0xdead00000000000000000000000000000000dead",
                "0x72b971717e088b59f26d4236be222adb6acd393b") are called, and
                implementation() of the three addresses and implementations()
                are read; then the db is reopened and implementations() read again
              then: >
                first {"0x069c4c579671f8c120b1327a73217d01ea2ec5ea": {"implementation": None, "code_id": None},
                "0x0c0105334a50db16b51b2911c9956539753a2cf8": {"implementation": None, "code_id": None}}
                (the WETH9 and the implementation rows are not standard
                proxies and are absent); after the writes
                implementation("0x0c0105334a50db16b51b2911c9956539753a2cf8") is
                "0x72b971717e088b59f26d4236be222adb6acd393b" (lowercase),
                implementation("0x069c4c579671f8c120b1327a73217d01ea2ec5ea") is
                "0x1111111111111111111111111111111111111111",
                implementation("0xdead00000000000000000000000000000000dead") is
                None and has_address of it is False (nothing inserted);
                implementations() is
                {"0x069c4c579671f8c120b1327a73217d01ea2ec5ea": {"implementation": "0x1111111111111111111111111111111111111111", "code_id": None},
                "0x0c0105334a50db16b51b2911c9956539753a2cf8": {"implementation": "0x72b971717e088b59f26d4236be222adb6acd393b",
                "code_id": "148d598b091197e8547a99bb62fb69d3003cfcad58124c5d847b1de213ecbf28"}};
                the reopened db gives the same dict; the four rows keep their
                block and origin
              ref: 'phase 14; 0x72b9…393b is the implementation of the seed proxy, slot read on the public node 2026-10-01; 0x069c…5ea is a live proxy pointing at the same implementation'
            - given: >
                a phase-13 database: a file made with the phase-13 schema
                (addresses with the four columns address, code_id, block,
                origin, no implementation) holding the 130 codes and the 206
